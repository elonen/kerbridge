# Everything here is `make` underneath, so a green run means the same
# commands pass on a developer's machine.
#
#   changes  Whether the push touched anything but prose. Gates every test or
#            build job except `fast` and `audit`. It answers `true` for a pull
#            request, so the gate only ever skips work on a push to main.
#   fast     Fast checks without Docker. Ungated: it runs the doc checks, which
#            a prose-only push is exactly the thing that can break.
#   windows  The cross-build gate for the client.
#   macos    The gate for the other client half, on a Mac runner. Its tests
#            link the real Kerberos.framework, so they run rather than compile.
#            Billed at ten times an ubuntu runner, so the gate earns most here.
#   authentik  The pinned blueprint and authorization-code proof, with no Rust
#              or KerBridge container.
#   build    Main, manual. Every shipping artifact still builds.
#   stack    Main, manual. A realm provisioned from scratch, a TGT issued
#            against it, and a file read over SMB with that ticket.
#   deb      Main, manual. Debian packages built and lintian-clean, then
#            installed, purged or refused on each release the docs claim.
#            Once per architecture, on a runner of that architecture.
#   audit    Manual. Advisories against the tree's dependencies.
#
# No job needs a secret. `stack` mocks Entra with a locally generated key document.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Answers one question for the jobs below: did this push touch anything a
  # build could notice? Asked over the compare API rather than a checkout, so
  # it costs seconds rather than a clone.
  #
  # Every uncertain answer is `true`. A first push to a branch, a force-push
  # whose base is gone, a manual run, a compare too large to return in one
  # page -- each runs everything. A wasted hour is recoverable; a regression
  # that reached main because the gate guessed wrong is not.
  changes:
    name: anything but prose
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          everything() { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = push ] || everything
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) everything ;; esac
          gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
            --jq '.files[].filename' > files 2>/dev/null || everything
          # The compare API returns at most 300 files and does not say when it
          # truncated, so a push at the ceiling is treated as unknown.
          [ "$(wc -l < files)" -lt 300 ] || everything
          cat files

          # Prose is `docs/` and any `.md`, with one exception: the package
          # version and the release notes are read out of CHANGELOG.md, so an
          # edit to it is something `deb` can notice.
          grep -vE '^(docs/|.*\.md$)' files > interesting || true
          grep -qx CHANGELOG.md files && echo CHANGELOG.md >> interesting || true
          if [ -s interesting ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "prose only: the heavy jobs are skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  fast:
    name: fast (fmt, tests, clippy, shell, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: test tools
        run: |
          command -v shellcheck >/dev/null && command -v zstd >/dev/null || {
            sudo apt-get update && sudo apt-get install -y shellcheck zstd
          }
      - run: make test-fast

  windows:
    name: windows client (cross-build, clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      - run: make test-win

  macos:
    name: macos client (build, clippy, tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # arm64, and pinned rather than `macos-latest`: a runner image that rotates
    # under the release job would change what ships without a commit saying so.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      # Unlike `test-win`, this runs the client core's tests rather than only
      # compiling them: on a Mac they link the real Kerberos.framework and
      # libresolv. Everything it needs -- the toolchain, the SDK, codesign --
      # is on the runner image; `make icon` is what would want librsvg, and the
      # .icns it writes is committed.
      - run: make test-mac

  authentik:
    name: authentik (blueprint, authorization code)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make test-authentik

  build:
    name: artifacts (images, exes, MSI)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0. `make` derives KB_VERSION from `git describe`, and
      # compose's `debs` service requires it. A shallow checkout reaches no tag,
      # so compose refuses before any Dockerfile runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-amd64-${{ hashFiles('Cargo.lock', 'crates/**', 'debian/stage-prebuilt', 'debian/about.toml', 'debian/about.hbs') }}
          restore-keys: buildx-amd64-
      - run: make test-build
        env:
          KB_CACHE_FROM: type=local,src=/tmp/buildx-cache
          KB_CACHE_TO: type=local,dest=/tmp/buildx-cache-new,mode=max
      - name: rotate the layer cache
        if: always()
        run: |
          if [ -d /tmp/buildx-cache-new ]; then
            rm -rf /tmp/buildx-cache
            mv /tmp/buildx-cache-new /tmp/buildx-cache
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kerbridge-artifacts
          path: |
            dist/*.exe
            dist/*.msi
            dist/kbmanage
            dist/kbconfig
          if-no-files-found: error

  stack:
    name: stack (provision, issue, SMB)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Provisioning a fresh domain and joining a member to it is the slow part;
    # the default 360 would let a hung KDC burn an hour.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0. `make` derives KB_VERSION from `git describe`, and
      # compose's `debs` service requires it. A shallow checkout reaches no tag,
      # so compose refuses before any Dockerfile runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      # Everything else it needs -- docker, rsync, openssl, curl, python3 -- is
      # on the runner image, and ci-stack.sh checks for each before it starts.
      #
      # No `if: failure()` log step here: it would run after ci-stack.sh's own
      # trap had torn the stack down, and read nothing. The script dumps
      # `compose ps` and the logs itself, before it removes anything, so a
      # developer watching a local run sees the same thing this job does.
      # The compose `debs` service holds the six-crate compile that every service
      # image is built on, so one cache serves this whole job. One key for every
      # amd64 job, because `build`, `stack` and `deb` all reach that compile
      # through debian/Dockerfile's `build` stage: whichever job runs first
      # populates it, and a second write under the same key is dropped rather
      # than duplicated. arm64 keeps a key of its own -- different binaries.
      - uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-amd64-${{ hashFiles('Cargo.lock', 'crates/**', 'debian/stage-prebuilt', 'debian/about.toml', 'debian/about.hbs') }}
          restore-keys: buildx-amd64-
      - run: make test-stack
        env:
          KB_CACHE_FROM: type=local,src=/tmp/buildx-cache
          KB_CACHE_TO: type=local,dest=/tmp/buildx-cache-new,mode=max
      - name: rotate the layer cache
        if: always()
        run: |
          if [ -d /tmp/buildx-cache-new ]; then
            rm -rf /tmp/buildx-cache
            mv /tmp/buildx-cache-new /tmp/buildx-cache
          fi

  deb:
    name: debs (${{ matrix.arch }})
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The default 360 would let a stalled mirror burn six hours.
    timeout-minutes: 60
    steps:
      # fetch-depth: 0. `make` derives the package version on the runner with
      # `debian/make-changelog --print-version`, which reads `git describe`, and
      # a shallow checkout reaches no tag -- the build then refuses rather than
      # producing a package nothing can order.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/buildx-cache
          key: buildx-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'crates/**', 'debian/stage-prebuilt', 'debian/about.toml', 'debian/about.hbs') }}
          restore-keys: buildx-${{ matrix.arch }}-
      - run: >
          make test-deb
          DOCKER_CACHE="--cache-from type=local,src=/tmp/buildx-cache
          --cache-to type=local,dest=/tmp/buildx-cache-new,mode=max"
      - name: rotate the layer cache
        if: always()
        run: |
          if [ -d /tmp/buildx-cache-new ]; then
            rm -rf /tmp/buildx-cache
            mv /tmp/buildx-cache-new /tmp/buildx-cache
          fi
      # The debs themselves, so a failure on one release can be reproduced
      # against the exact bytes that failed rather than a rebuild of them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerbridge-debs-${{ matrix.arch }}
          path: dist/debian/*.deb
          if-no-files-found: ignore

  audit:
    name: advisories
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # Dependency audit. It is not a pull-request gate
      # on purpose: an advisory published overnight is not a
      # defect in the change somebody is trying to merge.
      - run: cargo audit
