# cargo-about, for THIRD-PARTY-NOTICES: the licence notices every static musl
# binary has to carry.
#
# WHY THIS FILE EXISTS. Nothing in Debian Policy and no lintian tag requires a
# package to enumerate the crates statically linked into it -- Debian's own Rust
# packaging never vendors, so the question does not arise there. But MIT, BSD
# and Apache-2.0 each require their notice to travel with a binary copy, and a
# static binary is a binary copy. So this is a licensing obligation rather than
# a packaging one, discharged in a generated file rather than in
# debian/copyright, so that it cannot fall out of step with the lock file.
#
# Generated by `debian/stage-prebuilt`, into the tree debian/rules stages.
#
# It lives under debian/ because that is the only caller today. The Docker
# images ship the same static binaries and carry the same obligation; nothing
# puts these notices in them yet.

# Every target the workspace ships for. `all-features` is off deliberately: a
# feature nothing enables links no crate, and listing its licence would claim
# more than is in the binary.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# Build and dev dependencies are not in the shipped binary, so their notices do
# not travel with it. Transitive runtime dependencies are, and do.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Every licence in the tree today. A crate arriving under a licence not on this
# list stops the generator rather than being quietly omitted, which is the
# behaviour to want: the list is the review, and the failure is what brings a
# new one to somebody's attention.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
