# nginx in front of kerbridge-broker, on the broker's own host.
#
# The broker serves plain HTTP and refuses any listen address that is not on
# the loopback interface -- that is enforced in the program, so TLS terminates
# here, on this machine, and cannot terminate on another one.
#
# Copy to /etc/nginx/sites-available/kerbridge, symlink it into
# sites-enabled/, and replace the server name and the certificate paths. The
# certificate is yours to obtain; nginx has no ACME client of its own, so use
# certbot, dehydrated or a certificate you already have.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kerbridge.example.site;

    ssl_certificate     /etc/letsencrypt/live/kerbridge.example.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kerbridge.example.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A ticket response carries a credential cache; a request carries a bearer
    # token. Neither belongs in a log, so this server block logs no bodies and
    # you should not add a log_format that does.
    client_max_body_size 16k;

    # Deadlines. nginx's defaults are 60s for a client's header and body, which
    # is generous for a listener whose only legitimate client makes a couple of
    # requests a day.
    client_header_timeout 10s;
    client_body_timeout   30s;
    keepalive_timeout     60s;

    # Only the documented routes are proxied. Anything else never reaches the
    # broker at all, so this list has to move whenever the broker's router
    # does. The first segment is the source name, from main.toml's `sources`.
    # `/config` without a segment is the address an SRV record can express; the
    # broker answers it only where one source makes the answer unambiguous.
    #
    # `~` and not `~*`: source names are matched case-sensitively.
    location ~ ^(/config|/[A-Za-z0-9._-]+/(config|ticket|nonce|devices)(/[^/]+)?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Two deadlines on the upstream rather than one: a slow directory plus
        # a slow issuance is the broker's own two timeouts, and cutting the
        # connection earlier than that turns a slow ticket into no ticket.
        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;
    }

    # Everything else, including anything deeper than the routes above.
    location / {
        return 404;
    }
}
