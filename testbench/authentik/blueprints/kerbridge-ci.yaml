# The whole authentik fixture the CI tier needs, as one atomic blueprint.
#
#   ak apply_blueprint /kerbridge/kerbridge-ci.yaml
#
# Applied by the authentik-init service in deploy/compose.authentik.yaml, not
# auto-discovered: it is mounted outside /blueprints so nothing applies it twice.
# `ak apply_blueprint` is synchronous and the entries are one transaction -- any
# failing entry rolls the whole file back, so a partial fixture is unreachable.
#
# This is the operator blueprint (docs/setup/authentik-blueprint.yaml) with the
# three things a no-human tier needs added: a bench user with a known password to
# sign in as, a constant API token because authentik makes one unreadable after
# creation, and a second application so a cross-application token has somewhere to
# come from. The four invisible provider settings, the loopback regex and the
# read-only role are all the operator blueprint's, measured live at 2026.8.0.
version: 1
metadata:
  name: kerbridge ci fixture

entries:
  # The provider the broker verifies against and the agent signs in through.
  # state: present re-applies the four settings that fail silently.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    id: kerbridge-provider
    identifiers:
      name: KerBridge
    attrs:
      client_type: public
      client_id: kerbridge
      # The agent binds an ephemeral loopback port, so the whole range must be
      # admitted: authentik does not implement RFC 8252 section 7.3. Single
      # quotes -- a backslash in plain YAML is literal, and double quotes would
      # store `127.0.0.1` as a regex matching any character for the dots.
      redirect_uris:
        - matching_mode: regex
          url: 'http://127\.0\.0\.1:[0-9]{1,5}'
      # A blueprint-created provider gets `grant_types: []` and then refuses
      # authorization_code with a bare invalid_request. The admin UI fills this in;
      # a blueprint does not.
      grant_types:
        - authorization_code
        - refresh_token
      # The default hashed_user_id cannot be looked up through the REST API, so
      # sync could never match a signed-in user to a directory entry.
      sub_mode: user_uuid
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_code_validity: minutes=5
      # WITHOUT this a provider signs HS256 with its client secret and publishes
      # an empty JWKS. The default, not a corner case.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      # offline_access must be attached here AND requested by the client; left
      # off, the scope is dropped without a word and no refresh token is issued.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]

  - model: authentik_core.application
    identifiers:
      slug: kerbridge
    attrs:
      name: KerBridge
      provider: !KeyOf kerbridge-provider
      # No policies bound, so nothing stands between the authorization flow and
      # the code.
      policy_engine_mode: any

  # The neighbour. Same client_id on purpose: aud is then correct on its token
  # and only `iss` differs, because issuer_mode is per_provider and the issuer is
  # keyed by application slug. That is the one live negative the token corpus
  # cannot forge from one instance -- a cross-application token refused on the
  # issuer, not the audience. The forged wrong-audience token stays with the
  # corpus.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    id: kerbridge-provider-second
    identifiers:
      name: KerBridge Second
    attrs:
      client_type: public
      client_id: kerbridge
      redirect_uris:
        - matching_mode: regex
          url: 'http://127\.0\.0\.1:[0-9]{1,5}'
      grant_types:
        - authorization_code
        - refresh_token
      sub_mode: user_uuid
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_code_validity: minutes=5
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]

  - model: authentik_core.application
    identifiers:
      slug: kerbridge-second
    attrs:
      name: KerBridge Second
      provider: !KeyOf kerbridge-provider-second
      policy_engine_mode: any

  # Whom the broker admits. Bench user is a member so a signed-in token resolves
  # to a directory account once the directory face lands.
  - model: authentik_core.group
    state: present
    identifiers:
      name: KerBridge Allowed On-prem Users
    attrs:
      users:
        - !KeyOf kerbridge-bench-user

  # The person the sign-in step drives. `password` is a blueprint-only field;
  # `type: internal` because UserWriteStage would default an enrolled account to
  # external, and both are people.
  - model: authentik_core.user
    id: kerbridge-bench-user
    identifiers:
      username: benchuser
    attrs:
      name: Bench User
      email: benchuser@bench.invalid
      is_active: true
      type: internal
      password: bench-user-password
      path: users

  # The read-only service account sync reads the directory as. Account, role,
  # global grant and group binding are the operator blueprint's, verbatim:
  # the grant is global (authentik_rbac.role permissions), because an object-level
  # one returns 200 with a silently shortened list that reconciles as departures.
  - model: authentik_core.user
    state: created
    id: kerbridge-sync-account
    identifiers:
      username: svc-kerbridge-sync
    attrs:
      name: KerBridge sync
      type: service_account
      is_active: true
      path: goauthentik.io/service-accounts

  - model: authentik_rbac.role
    state: present
    id: kerbridge-sync-role
    identifiers:
      name: KerBridge sync (read-only)
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.view_group

  - model: authentik_core.group
    state: present
    identifiers:
      name: KerBridge sync
    attrs:
      roles:
        - !KeyOf kerbridge-sync-role
      users:
        - !KeyOf kerbridge-sync-account

  # The API token, set by the blueprint because authentik makes it unreadable after
  # creation and there is no human to create it. The string is the token key
  # verbatim, and intent: api is the one intent TokenAuthentication looks up.
  # expiring: false -- no countdown to read, and this tier verifies no expiry.
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: kerbridge-sync-api-token
    attrs:
      key: bench-authentik-sync-token
      intent: api
      user: !KeyOf kerbridge-sync-account
      expiring: false
      description: KerBridge sync (bench)
