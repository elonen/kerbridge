headline_note = "<strong>An expiry warning is not a fault.</strong> It means the app has run out of quiet ways to renew — often simply because you closed the browser session, or the device's authorization is coming up for renewal. Your access is intact until the time shown. One click restores the quiet renewals."

tech_condition_hint = "what the headline is computed from"
tech_condition = [
  "The headline renders <code>Condition</code>, one of <code>Working</code>, <code>Flaky</code>, <code>WillStop</code>, <code>Stopped</code> and <code>NotStarted</code>. It is a pure function of three local facts: whether a <strong>usable</strong> ticket is held, whether this machine is expected to be working here, and whether a <strong>silent supply</strong> for the next renewal exists.",
  "No network fact enters it — a broker outage never moves the condition. It shows up as a blocker, and as <code>Flaky</code> only once it has persisted.",
]

identity_title = "The identity line"
identity_signed_in = "The account your access — and anything you save — belongs to."
identity_working_as = "This computer has been set up to work as a <em>different account</em>."
identity_note = "<strong>The second one is worth reading twice.</strong> On such a computer, files you save to the network drives are saved under that (often shared) account's name, not yours. If you sign in here, you are vouching for the machine — you are not getting your own access. This is normal on build machines, kiosks and shared workstations, and your IT team set it up deliberately."

tech_delegation_hint = "device grants"
tech_delegation = [
  "The machine is <strong>delegated</strong> to get TGTs for a specific account: a <code>grant_for</code> target is configured, so only a device grant can obtain a ticket and the tickets carry the target's principal. A delegated sign-in <strong>authorizes access as the specified user</strong>, not as the person signing in — the sign-in proves who is at the keyboard, not the account the machine reaches your Kerberos services as.",
]

