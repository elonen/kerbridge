doors_title = "Leaving — the three separate doors"
doors_lead = "These sound similar but have a different effect. This is the one table on this page worth bookmarking."
tech_doors_hint = "what each door actually does"
tech_doors = [
  "<strong>Signing out of the identity provider</strong> ends the SSO session at the authority and drops the in-memory refresh token. It cannot sign you out of Windows itself; an application can only release its own session.",
  "<strong>Removing the authorization</strong> deletes the device grant's non-exportable ECDSA P-256 key from this device's TPM <em>first</em>, then revokes it at the broker — that order is what makes it work offline.",
  "<strong>Signing off</strong> is a realm-scoped purge of the ticket cache — the TGT and the service tickets for this realm only. Tickets for other realms are left alone, which is what makes it safe on a cloud-trust tenant. An SMB session already established keeps serving files off an empty cache with no Kerberos traffic, so no ticket-scoped verb can honestly promise that connections end.",
]

fixing_title = "Fixing things"
fixing = [
  { action = "act_enroll",              does = "One-time, per computer. Teaches Windows about your organisation's realm. Needs administrator permission and a restart afterwards." },
  { action = "act_restart_workstation", does = "Clears a stuck network-drive state. <strong>Save your work first</strong> — every network drive on the computer disconnects, not just these ones." },
  { action = "act_reenroll",            does = "The same setup, applied over a partial or stale one. In Settings ▸ Advanced." },
  { action = "act_unenroll",            does = "Removes the setup entirely. In Settings ▸ Advanced." },
]
fixing_note = "Anything that cannot be undone asks you first, tells you exactly what it will do, and defaults to cancelling. You can close that window and let the work run — it will tell you how it went."
fixing_mac = "<strong>macOS needs none of this.</strong> It finds the realm by itself, so there is no setup step, no administrator prompt anywhere in the product, and no repair — a dropped connection there simply reconnects."

