# ── Part 1: what this app is for ─────────────────────────────────────────────
shot_alt_win = "The NAS Access status panel open above the Windows notification area, reading Access OK."
shot_alt_mac = "The NAS Access menu open in the macOS menu bar, reading Access OK."
shot_caption_win = "If this looks familiar, you're in the right place — it opens from the notification area."
shot_caption_mac = "If this looks familiar, you're in the right place — it opens from the menu bar."

two_worlds_title = "Two systems that don't naturally meet"
two_worlds = [
  "<strong>Your account lives in the cloud.</strong> It is the same account you use for email and for signing in to work websites. Your organisation manages it there.",
  "<strong>Your files live in your building.</strong> They sit on a file server — the box your network drives and shared folders come from. That server is deliberately old-fashioned about security, and it has never heard of the cloud.",
  "Left alone, the two cannot agree that you are you.",
]

gobetween_title = "NAS Access is the go-between"
gobetween_lead = "NAS Access converts your cloud sign-in into a pass the file server understands and accepts."

worth_knowing_title = "Three things worth knowing"
worth_knowing = [
  "<strong>The pass has a time limit.</strong> Typically most of a working day. This is normal and deliberate — it is what lets your organisation take access away when it needs to.",
  "<strong>NAS Access quietly gets a fresh pass about halfway through</strong>, long before the old one runs out. On an ordinary day you will never see this happen.",
  "<strong>It cannot renew what it does not have.</strong> If the app cannot get a fresh pass on its own, it tells you <em>before</em> the current one runs out, so you can click once and carry on.",
]

tech_concepts_hint = "the precise terms, for anyone who wants them"
tech_concepts = [
  "Your cloud account is an <strong>OIDC</strong> identity at an <strong>identity provider</strong> (Entra ID in most deployments). The proof is an OIDC access token, obtained through an authorization-code flow with PKCE in the system browser.",
  "The <strong>broker</strong> is the KerBridge service your IT team runs. It validates the token and asks the <strong>KDC</strong> to issue a genuine <strong>Kerberos TGT</strong> (ticket-granting ticket) for your account in the on-premises <strong>realm</strong>.",
  "The \"pass pocket\" is your login session's <strong>ticket cache</strong> — the LSA logon session on Windows, the Heimdal <code>API:</code> cache on macOS. Putting the ticket there is called <strong>injection</strong>. After that, the stock SMB client does ordinary Kerberos: it uses the TGT to get a service ticket for the file server. No part of the file access path is modified.",
  "The \"fresh pass at halfway\" is <strong>re-injection</strong>, not a Kerberos-level renewal. According to our tests, Windows will ask the KDC to renew a KerBridge-injected TGT and then never install the result, so the agent runs the whole exchange again and injects a new ticket instead.",
]

not_do_title = "What it does not do"
not_do = [
  "It does not store your password. It never sees one.",
  "It does not read or change your files, your drives, or your drive letters.",
  "It does not replace your organisation's sign-in. It uses it.",
  "It does not need to be running for you to <em>use</em> your computer — only to keep your network drives reachable.",
]

tech_at_rest_hint = "what is kept, and where"
tech_at_rest = [
  "<strong>No secret at rest.</strong> The access token is discarded the moment the ticket exchange completes. The refresh token is held in process memory only and dies with the process — it is never written to disk or to the log. What is stored on disk is the broker URL, a cached copy of the discovered configuration, and this device's authorization state. It does not even really know about your NAS or other Kerberos services; it only deals with Kerberos TGTs.",
]

