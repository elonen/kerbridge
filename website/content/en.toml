# ─────────────────────────────────────────────────────────────────────────────
# Everything below uses TOML table syntax, and a table header captures every
# bare key that follows it -- so these have to be last. Add new plain keys
# above this line, not below it.
# ─────────────────────────────────────────────────────────────────────────────

# The three doors. `access`/`grant`/`signin` drive the Yes/No table, and the
# order here is the order of both the table and the explanations under it.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Closes the sign-in session this app left in your browser. It is good hygiene on a shared computer. It does not touch your drives."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Gives up this device's permission to reach your drives <em>without a browser</em>. Your access right now is untouched — you simply go back to signing in through the browser each time. It cannot be undone: authorizing again creates a fresh permission rather than restoring the old one."
caveat = """
On a shared-account machine — one whose panel says it is working as another \
account — there is no "go back to the browser". Authorization is the only way \
such a machine gets access, so removing it means access runs out and stops. \
The confirmation tells you exactly how long you have."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Throws away this computer's pass. It is the everyday one — the thing to do when you are done for the day, or don't need shared drive access any more."
caveat = """
One honest caveat: <strong>network drives you already have open may keep \
working</strong> until you close them or restart. That is your operating system \
holding a connection open, and no app can promise otherwise. But nothing new \
can be opened."""

