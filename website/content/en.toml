# ── Part 8: quick answers ────────────────────────────────────────────────────
answers = [
  { q = "Do I have to keep the app running?", a = "Yes, to keep drives reachable. It uses almost nothing while idle, and starting it at login means you never think about it." },
  { q = "Why does a browser window open when I sign in?", a = "Because your sign-in belongs to your organisation, not to this app. The app never sees your password — your browser handles it, exactly as it does for your other work sites." },
  { q = "Why didn't it ask me for anything this morning?", a = "Because it didn't have to. That is the intended experience." },
  { q = "I closed the lid over lunch.", a = "Fine. It picks up where it left off, and gets a fresh pass if needed." },
  { q = "I'm working from home.", a = "Whatever normally reaches your file server — VPN or otherwise — is what NAS Access needs too. If your drives work at home today, they will work with NAS Access." },
  { q = "Is my password stored anywhere?", a = "No. The app never receives one. Nothing it keeps on disk can be used to sign in as you." },
  { q = "Can IT see what I open?", a = "NAS Access does not watch your files. Your file server keeps its own records, as it always has." },
  { q = "I signed off, but a drive is still open.", a = "Your operating system is holding a connection it already had. Close the window, disconnect the drive, or restart. Nothing new can be opened." },
]

