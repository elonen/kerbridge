tech_grant_hint = "the device grant"
tech_grant = [
  "This is a KerBridge <strong>device grant</strong> — a non-exportable ECDSA P-256 key in the TPM, created through CNG's platform crypto provider at user scope, so it needs no elevation and dies with the profile. The broker holds the matching public key and enforces its own day cap, so lowering that cap shortens every outstanding grant.",
]

