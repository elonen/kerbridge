# Tästä alaspäin käytetään TOML:n taulukkosyntaksia, ja taulukon otsikko nappaa
# kaikki sen jälkeen tulevat avaimet — joten näiden on oltava viimeisinä. Lisää
# uudet tavalliset avaimet tämän viivan yläpuolelle.
# ─────────────────────────────────────────────────────────────────────────────

# Kolme ovea. `access`/`grant`/`signin` ohjaavat Kyllä/Ei-taulukkoa, ja tämä
# järjestys on sekä taulukon että sen alla olevien selitysten järjestys.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Sulkee kirjautumisistunnon, jonka tämä sovellus jätti selaimeesi. Hyvää hygieniaa jaetulla koneella. Asemiisi se ei vaikuta."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Luopuu tämän laitteen luvasta tavoittaa asemasi <em>ilman selainta</em>. Nykyinen käyttöoikeutesi ei muutu — palaat vain kirjautumaan selaimen kautta joka kerta. Tätä ei voi kumota: uusi valtuutus luo uuden luvan eikä palauta vanhaa."
caveat = """
Jaetun tunnuksen koneella — sellaisella, jonka näkymä kertoo sen toimivan \
toisen tunnuksen nimissä — ei ole mitään \"paluuta selaimeen\". Valtuutus on \
ainoa tapa, jolla tällainen kone saa käyttöoikeuden, joten sen poistaminen \
tarkoittaa, että käyttöoikeus kuluu loppuun ja päättyy. Vahvistusikkuna \
kertoo tarkalleen, kuinka paljon aikaa sinulla on."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Heittää pois tämän koneen kulkuluvan. Tämä on se arkinen ovi — se, jota käytät, kun lopettelet päivän töitä tai kun et enää tarvitse jaettuja asemia."
caveat = """
Yksi rehellinen varaus: <strong>jo avoinna olevat verkkoasemat voivat jatkaa \
toimintaansa</strong>, kunnes suljet ne tai käynnistät koneen uudelleen. Se on \
käyttöjärjestelmäsi tapa pitää yhteyttä auki, eikä mikään sovellus voi luvata \
muuta. Mitään uutta ei kuitenkaan voi avata."""

