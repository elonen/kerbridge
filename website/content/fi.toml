worth_knowing_title = "Kolme asiaa, jotka on hyvä tietää"
worth_knowing = [
  "<strong>Kulkuluvalla on aikaraja.</strong> Tyypillisesti suurin osa työpäivästä. Tämä on normaalia ja tarkoituksellista — juuri se antaa organisaatiollesi mahdollisuuden ottaa käyttöoikeus pois tarvittaessa.",
  "<strong>NAS Access hakee huomaamatta uuden kulkuluvan noin puolivälissä</strong>, hyvissä ajoin ennen vanhan umpeutumista. Tavallisena päivänä et huomaa tästä mitään.",
  "<strong>Se ei voi uusia sellaista, mitä sillä ei ole.</strong> Jos sovellus ei saa uutta kulkulupaa itsenäisesti, se kertoo siitä <em>ennen</em> nykyisen umpeutumista, jotta ehdit napsauttaa kerran ja jatkaa työtäsi.",
]

tech_concepts_hint = "täsmälliset termit niitä kaipaaville"
tech_concepts = [
  "Pilvitunnuksesi on <strong>OIDC</strong>-identiteetti <strong>identiteetintarjoajalla</strong> (useimmissa asennuksissa Entra ID). Todisteena on OIDC-käyttöoikeustunnus, joka hankitaan authorization code -kululla ja PKCE:llä järjestelmän selaimessa.",
  "<strong>Broker</strong> on IT-tukesi ylläpitämä KerBridge-palvelu. Se tarkistaa käyttöoikeustunnuksen ja pyytää <strong>KDC</strong>:tä myöntämään aidon <strong>Kerberos-TGT</strong>:n (ticket-granting ticket) tunnuksellesi paikallisessa <strong>realmissa</strong>.",
  "\"Kulkulupataskuna\" toimii kirjautumisistuntosi <strong>lipputaltio</strong> — Windowsissa LSA-kirjautumisistunto, macOS:ssä Heimdalin <code>API:</code>-taltio. Lipun asettamista sinne kutsutaan nimellä <strong>injektio</strong>. Sen jälkeen tavallinen SMB-asiakas tekee tavanomaista Kerberosta: se hakee TGT:llä palvelulipun tiedostopalvelimelle. Mitään tiedostojen käyttöpolun osaa ei ole muutettu.",
  "\"Uusi kulkulupa puolivälissä\" on <strong>uudelleeninjektio</strong>, ei Kerberos-tason uusinta. Testiemme mukaan Windows kyllä pyytää KDC:tä uusimaan KerBridgen injektoiman TGT:n, mutta ei koskaan asenna tulosta — joten agentti tekee koko vaihdon uudelleen ja injektoi uuden lipun.",
]

