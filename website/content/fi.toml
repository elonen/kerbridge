tech_at_rest_hint = "mitä säilytetään ja missä"
tech_at_rest = [
  "<strong>Levylle ei jää salaisuuksia.</strong> Käyttöoikeustunnus hylätään heti lipunvaihdon valmistuttua. Päivitystunnus pidetään vain prosessin muistissa ja katoaa prosessin mukana — sitä ei kirjoiteta levylle eikä lokiin. Levylle tallentuvat brokerin URL-osoite, välimuistiin tallennettu kopio löydetyistä asetuksista sekä tämän laitteen valtuutustila. Se ei oikeastaan edes tiedä NAS-laitteestasi tai muista Kerberos-palveluista; se käsittelee vain Kerberos-TGT:itä.",
]

