# ─────────────────────────────────────────────────────────────────────────────
# Da qui in giù si usa la sintassi delle tabelle TOML, e un'intestazione di
# tabella cattura ogni chiave semplice che la segue — quindi queste devono
# stare per ultime. Aggiungi le nuove chiavi semplici sopra questa riga, non
# sotto.
# ─────────────────────────────────────────────────────────────────────────────

# Le tre porte. `access`/`grant`/`signin` guidano la tabella Sì/No, e l'ordine
# qui è l'ordine sia della tabella sia delle spiegazioni sotto di essa.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Chiude la sessione di accesso che questa app ha lasciato nel tuo browser. È buona igiene su un computer condiviso. Non tocca le tue unità."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Rinuncia al permesso di questo dispositivo di raggiungere le tue unità <em>senza browser</em>. Il tuo accesso di adesso resta intatto — semplicemente torni ad accedere dal browser ogni volta. Non si può annullare: autorizzare di nuovo crea un permesso nuovo, non ripristina il vecchio."
caveat = """
Su una macchina ad account condiviso — una il cui pannello dice che funziona \
come un altro account — non esiste alcun \"tornare al browser\". \
L'autorizzazione è l'unico modo in cui una macchina così ottiene l'accesso, \
quindi rimuoverla significa che l'accesso scade e si ferma. La conferma ti \
dice esattamente quanto tempo hai."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Butta via il lasciapassare di questo computer. È la porta di tutti i giorni — quella da usare quando hai finito per oggi, o non ti serve più l'accesso alle unità condivise."
caveat = """
Un'avvertenza onesta: <strong>le unità di rete che hai già aperte possono \
continuare a funzionare</strong> finché non le chiudi o non riavvii. È il tuo \
sistema operativo che tiene aperta una connessione, e nessuna app può \
promettere il contrario. Ma non si può aprire nulla di nuovo."""

