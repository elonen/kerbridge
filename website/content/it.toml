two_worlds_title = "Due sistemi che da soli non si incontrano"
two_worlds = [
  "<strong>Il tuo account vive nel cloud.</strong> È lo stesso con cui leggi la posta e accedi ai siti di lavoro. La tua organizzazione lo gestisce lì.",
  "<strong>I tuoi file vivono nel tuo edificio.</strong> Stanno su un file server — la macchina da cui arrivano le unità di rete e le cartelle condivise. Sulla sicurezza quel server è all'antica di proposito, e del cloud non ha mai sentito parlare.",
  "Lasciati a se stessi, i due non riescono a mettersi d'accordo sul fatto che tu sia tu.",
]

gobetween_title = "NAS Access fa da tramite"
gobetween_lead = "NAS Access trasforma il tuo accesso cloud in un lasciapassare che il file server capisce e accetta."

worth_knowing_title = "Tre cose che vale la pena sapere"
worth_knowing = [
  "<strong>Il lasciapassare ha una scadenza.</strong> In genere buona parte di una giornata di lavoro. È normale e voluto — è ciò che permette alla tua organizzazione di togliere l'accesso quando serve.",
  "<strong>NAS Access ne ottiene uno nuovo in silenzio verso metà strada</strong>, molto prima che il vecchio scada. In una giornata normale non te ne accorgerai mai.",
  "<strong>Non può rinnovare ciò che non ha.</strong> Se l'app non riesce a ottenere un lasciapassare nuovo da sola, te lo dice <em>prima</em> che quello attuale scada, così basta un clic e continui a lavorare.",
]

tech_concepts_hint = "i termini precisi, per chi li vuole"
tech_concepts = [
  "Il tuo account cloud è un'identità <strong>OIDC</strong> presso un <strong>identity provider</strong> (Entra ID nella maggior parte delle installazioni). La prova è un access token OIDC, ottenuto con un flusso authorization code con PKCE nel browser di sistema.",
  "Il <strong>broker</strong> è il servizio KerBridge gestito dal tuo team IT. Convalida il token e chiede al <strong>KDC</strong> di emettere un autentico <strong>Kerberos TGT</strong> (ticket-granting ticket) per il tuo account nel <strong>realm</strong> in sede.",
  "La \"tasca del lasciapassare\" è la <strong>cache dei ticket</strong> della tua sessione di accesso — la sessione di logon LSA su Windows, la cache <code>API:</code> di Heimdal su macOS. Mettere lì il ticket si chiama <strong>iniezione</strong>. Da lì in poi il normale client SMB fa Kerberos ordinario: usa il TGT per ottenere un ticket di servizio per il file server. Nessuna parte del percorso di accesso ai file viene modificata.",
  "Il \"lasciapassare nuovo a metà strada\" è una <strong>re-iniezione</strong>, non un rinnovo a livello Kerberos. Secondo i nostri test Windows chiede sì al KDC di rinnovare un TGT iniettato da KerBridge, ma poi non installa mai il risultato — quindi l'agente ripete l'intero scambio e inietta un ticket nuovo.",
]

not_do_title = "Che cosa non fa"
not_do = [
  "Non memorizza la tua password. Non la vede mai.",
  "Non legge né modifica i tuoi file, le tue unità o le lettere delle unità.",
  "Non sostituisce l'accesso della tua organizzazione. Lo usa.",
  "Non deve essere in esecuzione perché tu possa <em>usare</em> il computer — solo perché le unità di rete restino raggiungibili.",
]

tech_at_rest_hint = "che cosa viene conservato, e dove"
tech_at_rest = [
  "<strong>Nessun segreto su disco.</strong> L'access token viene scartato nell'istante in cui lo scambio del ticket si completa. Il refresh token vive solo nella memoria del processo e muore con esso — non viene mai scritto su disco né nel registro. Su disco restano l'URL del broker, una copia in cache della configurazione scoperta e lo stato di autorizzazione di questo dispositivo. In realtà non sa nemmeno del tuo NAS o degli altri servizi Kerberos; tratta soltanto Kerberos TGT.",
]

