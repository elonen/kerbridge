  "<strong>Disconnettersi dall'identity provider</strong> termina la sessione SSO presso l'authority e scarta il refresh token in memoria. Non può disconnetterti da Windows stesso; un'applicazione può rilasciare solo la propria sessione.",
  "<strong>Rimuovere l'autorizzazione</strong> elimina <em>prima</em> la chiave ECDSA P-256 non esportabile della concessione dispositivo dal TPM di questo dispositivo, e solo dopo la revoca sul broker — è quell'ordine a farla funzionare anche offline.",
