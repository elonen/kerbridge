headline_note = "<strong>Un avviso di scadenza non è un guasto.</strong> Significa che all'app sono finiti i modi silenziosi di rinnovare — spesso semplicemente perché hai chiuso la sessione del browser, o perché l'autorizzazione del dispositivo si avvicina al rinnovo. Il tuo accesso resta intatto fino all'ora indicata. Un clic ripristina i rinnovi silenziosi."

tech_condition_hint = "da che cosa viene calcolata l'intestazione"
tech_condition = [
  "L'intestazione mostra <code>Condition</code>, uno fra <code>Working</code>, <code>Flaky</code>, <code>WillStop</code>, <code>Stopped</code> e <code>NotStarted</code>. È una funzione pura di tre fatti locali: se è presente un ticket <strong>utilizzabile</strong>, se ci si aspetta che questa macchina sia operativa qui, e se esiste una <strong>fonte silenziosa</strong> per il prossimo rinnovo.",
  "Nessun fatto di rete vi entra — un'interruzione del broker non sposta mai la condizione. Compare come ostacolo, e come <code>Flaky</code> solo quando persiste.",
]

identity_title = "La riga dell'identità"
identity_signed_in = "L'account a cui appartiene il tuo accesso — e tutto ciò che salvi."
identity_working_as = "Questo computer è stato configurato per funzionare come <em>un altro account</em>."
identity_note = "<strong>La seconda merita una doppia lettura.</strong> Su un computer così, i file che salvi sulle unità di rete finiscono a nome di quell'account (spesso condiviso), non a nome tuo. Se accedi qui, stai garantendo per la macchina — non stai ottenendo un accesso tuo. È normale su macchine di build, chioschi e postazioni condivise, e il tuo team IT l'ha configurato apposta."

tech_delegation_hint = "concessioni dispositivo"
tech_delegation = [
  "La macchina è <strong>delegata</strong> a ottenere TGT per un account specifico: è configurato un obiettivo <code>grant_for</code>, quindi solo una concessione dispositivo può ottenere un ticket, e i ticket portano il principal dell'obiettivo. Un accesso delegato <strong>autorizza l'accesso come l'utente specificato</strong>, non come la persona che accede — l'accesso dimostra chi è alla tastiera, non l'account con cui la macchina raggiunge i tuoi servizi Kerberos.",
]

