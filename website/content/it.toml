  "Questi sono <strong>ostacoli</strong>: ciò che manca in questo momento, immediato e senza deduzioni. Sono un elenco, non una classifica, perché più d'uno può essere vero allo stesso tempo, e il modello li riporta tutti anziché solo il più rumoroso.",
  "Gli ostacoli <em>spiegano</em>; le azioni <em>risolvono</em>. Non sono elenchi paralleli e nulla combacia fra loro. L'ostacolo del server irraggiungibile fonde irraggiungibile, TLS rifiutato, limite di richieste e 5xx, perché i quattro differiscono nella causa ma non in ciò che puoi farci; la frase esatta resta nel messaggio dettagliato.",
