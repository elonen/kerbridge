  { headline = "cond_will_stop", tone = "warn", means = "Le tue unità funzionano, ma l'accesso terminerà a un'ora nota e niente lo rinnoverà da solo.", todo = "Usa il pulsante che propone di estendere l'accesso, quando ti fa comodo, prima di quell'ora." },
