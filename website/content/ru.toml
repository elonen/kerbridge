tech_concepts_hint = "точные термины — для тех, кому они нужны"
tech_concepts = [
  "Ваша облачная учётная запись — это <strong>OIDC</strong>-идентичность у <strong>поставщика удостоверений</strong> (в большинстве развёртываний — Entra ID). Доказательством служит токен доступа OIDC, полученный в системном браузере по потоку authorization code с PKCE.",
  "<strong>Брокер</strong> — служба KerBridge, которую поддерживает ваша ИТ-команда. Он проверяет токен и просит <strong>KDC</strong> выдать настоящий <strong>Kerberos TGT</strong> (ticket-granting ticket) для вашей учётной записи в локальной <strong>области</strong> (realm).",
  "«Карман для пропусков» — это <strong>кэш билетов</strong> вашего сеанса входа: сеанс входа LSA в Windows, кэш Heimdal <code>API:</code> в macOS. Помещение билета туда называется <strong>внедрением</strong> (injection). Дальше штатный SMB-клиент делает обычный Kerberos: по TGT получает служебный билет к файловому серверу. Путь доступа к файлам не изменён ни в одной точке.",
  "«Свежий пропуск на середине срока» — это <strong>повторное внедрение</strong>, а не продление на уровне Kerberos. По нашим измерениям Windows просит KDC продлить внедрённый KerBridge TGT, но никогда не устанавливает результат — поэтому агент заново проходит весь обмен и внедряет новый билет.",
]

