# ─────────────────────────────────────────────────────────────────────────────
# Ниже используется табличный синтаксис TOML, а заголовок таблицы захватывает
# все простые ключи после себя — поэтому эти разделы обязаны идти последними.
# Новые простые ключи добавляйте выше этой линии, а не ниже.
# ─────────────────────────────────────────────────────────────────────────────

# Три двери. `access`/`grant`/`signin` управляют таблицей «Да/Нет», и порядок
# здесь — порядок и таблицы, и объяснений под ней.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Закрывает сеанс входа, который это приложение оставило в вашем браузере. На общем компьютере это хорошая гигиена. Дисков это не касается."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Отказывается от разрешения этого устройства добираться до дисков <em>без браузера</em>. Ваш текущий доступ не затронут — вы просто снова будете каждый раз входить через браузер. Отменить это нельзя: повторная авторизация создаёт новое разрешение, а не возвращает старое."
caveat = """
На машине с общей учётной записью — той, чья панель говорит, что она работает \
от имени другой учётной записи, — никакого «возврата к браузеру» нет. \
Авторизация — единственный способ, которым такая машина получает доступ, \
поэтому её удаление означает, что доступ истечёт и прекратится. Окно \
подтверждения точно скажет, сколько времени у вас остаётся."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Выбрасывает пропуск этого компьютера. Это повседневная дверь — то, что стоит сделать, закончив рабочий день или больше не нуждаясь в доступе к общим дискам."
caveat = """
Одна честная оговорка: <strong>уже открытые сетевые диски могут продолжать \
работать</strong>, пока вы их не закроете или не перезагрузитесь. Это ваша \
операционная система держит уже открытое соединение, и ни одно приложение не \
может обещать иного. Но ничего нового открыть уже нельзя."""

