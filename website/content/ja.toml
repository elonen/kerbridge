worth_knowing_title = "知っておくとよい三つのこと"
worth_knowing = [
  "<strong>通行証には期限があります。</strong> たいていは勤務時間のほぼ全体に相当する長さです。これは正常で意図的なもの — 組織が必要なときにアクセスを取り消せるのは、まさにこの仕組みのおかげです。",
  "<strong>NAS Access は期限の半ばごろに、静かに新しい通行証を取得します。</strong> 古いものが切れるずっと前です。ふだんの一日では、これが起きていることに気づくことはありません。",
  "<strong>持っていないものは更新できません。</strong> アプリが自力で新しい通行証を取得できない場合は、いまの通行証が切れる<em>前に</em>知らせるので、一度クリックするだけでそのまま作業を続けられます。",
]

tech_concepts_hint = "正確な用語を知りたい方へ"
tech_concepts = [
  "クラウドアカウントは<strong>ID プロバイダー</strong>（多くの環境では Entra ID）における <strong>OIDC</strong> アイデンティティです。証明となるのは OIDC アクセストークンで、システムのブラウザー上で PKCE 付きの認可コードフローによって取得します。",
  "<strong>ブローカー</strong>は IT チームが運用する KerBridge のサービスです。トークンを検証し、<strong>KDC</strong> に対して、オンプレミスの<strong>レルム</strong>におけるあなたのアカウント用の本物の <strong>Kerberos TGT</strong>（ticket-granting ticket）の発行を依頼します。",
  "「通行証入れ」にあたるのは、ログオンセッションの<strong>チケットキャッシュ</strong>です — Windows では LSA ログオンセッション、macOS では Heimdal の <code>API:</code> キャッシュ。そこにチケットを入れることを<strong>インジェクション</strong>と呼びます。その後は標準の SMB クライアントがふつうの Kerberos を行い、TGT を使ってファイルサーバー向けのサービスチケットを取得します。ファイルアクセス経路には一切手を加えていません。",
  "「半ばでの新しい通行証」は <strong>再インジェクション</strong>であって、Kerberos レベルの更新ではありません。私たちの検証では、Windows は KerBridge が注入した TGT の更新を KDC に要求しはするものの、その結果を決してインストールしません。そのためエージェントは交換全体をやり直し、新しいチケットを注入します。",
]

