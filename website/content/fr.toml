two_worlds_title = "Deux systèmes qui ne se rencontrent pas naturellement"
two_worlds = [
  "<strong>Votre compte vit dans le cloud.</strong> C'est le même compte que pour votre messagerie et pour vous connecter aux sites web professionnels. C'est là que votre organisation le gère.",
  "<strong>Vos fichiers vivent dans votre bâtiment.</strong> Ils sont sur un serveur de fichiers — la machine d'où viennent vos lecteurs réseau et vos dossiers partagés. Ce serveur est délibérément vieux jeu en matière de sécurité, et il n'a jamais entendu parler du cloud.",
  "Laissés à eux-mêmes, les deux ne peuvent pas s'accorder sur le fait que vous êtes bien vous.",
]

gobetween_title = "NAS Access fait l'intermédiaire"
gobetween_lead = "NAS Access convertit votre connexion cloud en un laissez-passer que le serveur de fichiers comprend et accepte."

worth_knowing_title = "Trois choses à savoir"
worth_knowing = [
  "<strong>Le laissez-passer a une durée limitée.</strong> En général, l'essentiel d'une journée de travail. C'est normal et voulu — c'est précisément ce qui permet à votre organisation de retirer l'accès quand elle en a besoin.",
  "<strong>NAS Access en obtient discrètement un nouveau à peu près à mi-parcours</strong>, bien avant l'expiration de l'ancien. Un jour ordinaire, vous ne verrez jamais cela se produire.",
  "<strong>Il ne peut pas renouveler ce qu'il n'a pas.</strong> Si l'application ne peut pas obtenir un nouveau laissez-passer toute seule, elle vous le dit <em>avant</em> l'expiration de l'actuel, pour que vous puissiez cliquer une fois et continuer.",
]

tech_concepts_hint = "les termes exacts, pour qui les veut"
tech_concepts = [
  "Votre compte cloud est une identité <strong>OIDC</strong> chez un <strong>fournisseur d'identité</strong> (Entra ID dans la plupart des déploiements). La preuve est un jeton d'accès OIDC, obtenu par un flux authorization code avec PKCE dans le navigateur du système.",
  "Le <strong>broker</strong> est le service KerBridge qu'exploite votre équipe informatique. Il valide le jeton et demande au <strong>KDC</strong> d'émettre un véritable <strong>TGT Kerberos</strong> (ticket-granting ticket) pour votre compte dans le <strong>royaume</strong> local.",
  "La « poche à laissez-passer » est le <strong>cache de tickets</strong> de votre session — la session de connexion LSA sous Windows, le cache Heimdal <code>API:</code> sous macOS. Y déposer le ticket s'appelle l'<strong>injection</strong>. Ensuite, le client SMB standard fait du Kerberos ordinaire : il utilise le TGT pour obtenir un ticket de service pour le serveur de fichiers. Aucune partie du chemin d'accès aux fichiers n'est modifiée.",
  "Le « nouveau laissez-passer à mi-parcours » est une <strong>réinjection</strong>, pas un renouvellement au niveau Kerberos. D'après nos tests, Windows demande bien au KDC de renouveler un TGT injecté par KerBridge, puis n'installe jamais le résultat — l'agent refait donc tout l'échange et injecte un nouveau ticket.",
]

not_do_title = "Ce qu'elle ne fait pas"
not_do = [
  "Elle ne stocke pas votre mot de passe. Elle n'en voit jamais.",
  "Elle ne lit ni ne modifie vos fichiers, vos lecteurs ou vos lettres de lecteur.",
  "Elle ne remplace pas la connexion de votre organisation. Elle s'en sert.",
  "Elle n'a pas besoin de tourner pour que vous puissiez <em>utiliser</em> votre ordinateur — seulement pour garder vos lecteurs réseau accessibles.",
]

tech_at_rest_hint = "ce qui est conservé, et où"
tech_at_rest = [
  "<strong>Aucun secret au repos.</strong> Le jeton d'accès est jeté dès que l'échange de ticket est terminé. Le jeton de rafraîchissement n'est gardé qu'en mémoire du processus et meurt avec lui — il n'est jamais écrit sur disque ni dans le journal. Ce qui est stocké sur disque : l'URL du broker, une copie en cache de la configuration découverte, et l'état d'autorisation de cet appareil. Elle ne connaît d'ailleurs pas vraiment votre NAS ni les autres services Kerberos ; elle ne manipule que des TGT Kerberos.",
]

