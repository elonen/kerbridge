tech_doors_hint = "ce que chaque porte fait réellement"
tech_doors = [
  "<strong>La déconnexion du fournisseur d'identité</strong> met fin à la session SSO chez l'autorité et jette le jeton de rafraîchissement conservé en mémoire. Elle ne peut pas vous déconnecter de Windows lui-même ; une application ne peut libérer que sa propre session.",
  "<strong>Le retrait de l'autorisation</strong> supprime <em>d'abord</em>, dans le TPM de cet appareil, la clé ECDSA P-256 non exportable de l'autorisation d'appareil, puis la révoque auprès du broker — c'est cet ordre qui lui permet de fonctionner hors ligne.",
  "<strong>La déconnexion</strong> est une purge du cache de tickets limitée au royaume — le TGT et les tickets de service de ce royaume seulement. Les tickets des autres royaumes sont laissés intacts, ce qui la rend sûre sur un locataire en cloud trust. Une session SMB déjà établie continue de servir des fichiers depuis un cache vide sans trafic Kerberos : aucune commande limitée aux tickets ne peut donc honnêtement promettre la fin des connexions.",
]

