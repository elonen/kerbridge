[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Ferme la session de connexion que cette application a laissée dans votre navigateur. C'est une saine habitude sur un ordinateur partagé. Cela ne touche pas à vos lecteurs."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Renonce à la permission de cet appareil d'atteindre vos lecteurs <em>sans navigateur</em>. Votre accès actuel n'est pas touché — vous repassez simplement par une connexion via le navigateur à chaque fois. C'est irréversible : autoriser à nouveau crée une nouvelle permission au lieu de restaurer l'ancienne."
caveat = """
Sur une machine à compte partagé — celle dont le panneau indique qu'elle \
fonctionne sous un autre compte — il n'y a pas de « retour au navigateur ». \
L'autorisation est le seul moyen pour une telle machine d'obtenir l'accès : la \
retirer signifie que l'accès expire et s'arrête. La confirmation vous dit \
exactement de combien de temps vous disposez."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Jette le laissez-passer de cet ordinateur. C'est celui du quotidien — ce qu'on fait en fin de journée, ou quand on n'a plus besoin d'accéder aux lecteurs partagés."
caveat = """
Une réserve honnête : <strong>les lecteurs réseau déjà ouverts peuvent \
continuer de fonctionner</strong> jusqu'à ce que vous les fermiez ou \
redémarriez. C'est votre système d'exploitation qui maintient une connexion \
ouverte, et aucune application ne peut promettre le contraire. Mais rien de \
nouveau ne peut être ouvert."""

