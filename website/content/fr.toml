  "Ce sont des <strong>obstacles</strong> : ce qui manque à l'instant, immédiat et non déduit. C'est une liste et non un classement, car plusieurs peuvent être vrais en même temps, et le modèle les signale tous, plutôt que seulement le plus bruyant.",
  "Les obstacles <em>expliquent</em> ; les actions <em>résolvent</em>. Ce ne sont pas des listes parallèles et rien ne s'aligne de l'une à l'autre. L'obstacle d'injoignabilité regroupe l'injoignable, le refus TLS, la limitation de débit et les 5xx, car ces quatre cas diffèrent par la cause mais pas par ce qu'il y a à faire ; la phrase exacte reste dans le message détaillé.",
