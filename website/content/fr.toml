headline_note = "<strong>Un avertissement d'expiration n'est pas une panne.</strong> Il signifie que l'application n'a plus de moyen discret de renouveler — souvent simplement parce que la session du navigateur a été fermée, ou parce que l'autorisation de l'appareil doit bientôt être renouvelée. Votre accès reste intact jusqu'à l'heure affichée. Un clic rétablit les renouvellements discrets."

tech_condition_hint = "à partir de quoi le titre est calculé"
tech_condition = [
  "Le titre affiche <code>Condition</code>, l'une de <code>Working</code>, <code>Flaky</code>, <code>WillStop</code>, <code>Stopped</code> et <code>NotStarted</code>. C'est une fonction pure de trois faits locaux : détient-on un ticket <strong>utilisable</strong>, cette machine est-elle censée fonctionner ici, et existe-t-il une <strong>source discrète</strong> pour le prochain renouvellement.",
  "Aucun fait réseau n'y entre — une panne du broker ne change jamais la condition. Elle apparaît comme un obstacle, et comme <code>Flaky</code> seulement une fois qu'elle a duré.",
]

identity_title = "La ligne d'identité"
identity_signed_in = "Le compte auquel appartient votre accès — et tout ce que vous enregistrez."
identity_working_as = "Cet ordinateur a été configuré pour fonctionner sous un <em>autre compte</em>."
identity_note = "<strong>La seconde mérite d'être relue.</strong> Sur un tel ordinateur, les fichiers que vous enregistrez sur les lecteurs réseau le sont au nom de ce compte (souvent partagé), pas au vôtre. Si vous vous connectez ici, vous vous portez garant de la machine — vous n'obtenez pas votre propre accès. C'est normal sur les machines de compilation, les bornes et les postes partagés, et votre équipe informatique l'a mis en place délibérément."

tech_delegation_hint = "les autorisations d'appareil"
tech_delegation = [
  "La machine est <strong>déléguée</strong> pour obtenir des TGT destinés à un compte précis : une cible <code>grant_for</code> est configurée, de sorte que seule une autorisation d'appareil peut obtenir un ticket et que les tickets portent le principal de la cible. Une connexion déléguée <strong>autorise l'accès en tant que l'utilisateur indiqué</strong>, et non en tant que la personne qui se connecte — la connexion prouve qui est au clavier, pas le compte avec lequel la machine atteint vos services Kerberos.",
]

