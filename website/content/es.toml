tech_delegation_hint = "concesiones de dispositivo"
tech_delegation = [
  "La máquina está <strong>delegada</strong> para obtener TGT para una cuenta concreta: hay configurado un destino <code>grant_for</code>, de modo que solo una concesión de dispositivo puede obtener un ticket, y los tickets llevan el principal del destino. Un inicio de sesión delegado <strong>autoriza el acceso como el usuario especificado</strong>, no como la persona que inicia sesión — el inicio de sesión demuestra quién está al teclado, no la cuenta con la que la máquina llega a tus servicios Kerberos.",
]

