two_worlds_title = "Dos sistemas que no se hablan por sí solos"
two_worlds = [
  "<strong>Tu cuenta vive en la nube.</strong> Es la misma cuenta que usas para el correo y para entrar en los sitios web del trabajo. Tu organización la administra allí.",
  "<strong>Tus archivos viven en tu edificio.</strong> Están en un servidor de archivos — la máquina de la que salen tus unidades de red y carpetas compartidas. Ese servidor es deliberadamente anticuado en cuestiones de seguridad, y no ha oído hablar de la nube en su vida.",
  "Dejados a su aire, los dos son incapaces de ponerse de acuerdo en que tú eres tú.",
]

gobetween_title = "NAS Access es el intermediario"
gobetween_lead = "NAS Access convierte tu inicio de sesión en la nube en un pase que el servidor de archivos entiende y acepta."

worth_knowing_title = "Tres cosas que conviene saber"
worth_knowing = [
  "<strong>El pase tiene un límite de tiempo.</strong> Normalmente, la mayor parte de una jornada de trabajo. Es normal y deliberado — es lo que permite a tu organización retirar el acceso cuando lo necesita.",
  "<strong>NAS Access consigue discretamente un pase nuevo hacia la mitad del plazo</strong>, mucho antes de que el anterior caduque. En un día normal nunca lo verás ocurrir.",
  "<strong>No puede renovar lo que no tiene.</strong> Si la aplicación no puede conseguir un pase nuevo por sí sola, te lo dice <em>antes</em> de que caduque el actual, para que puedas hacer un clic y seguir con lo tuyo.",
]

tech_concepts_hint = "los términos precisos, para quien los quiera"
tech_concepts = [
  "Tu cuenta en la nube es una identidad <strong>OIDC</strong> en un <strong>proveedor de identidad</strong> (Entra ID en la mayoría de las instalaciones). La prueba es un token de acceso OIDC, obtenido mediante un flujo de código de autorización con PKCE en el navegador del sistema.",
  "El <strong>bróker</strong> es el servicio KerBridge que administra tu equipo de TI. Valida el token y pide al <strong>KDC</strong> que emita un <strong>TGT de Kerberos</strong> auténtico (ticket-granting ticket) para tu cuenta en el <strong>reino</strong> local.",
  "El \"bolsillo de pases\" es la <strong>caché de tickets</strong> de tu sesión de inicio — la sesión de inicio LSA en Windows, la caché <code>API:</code> de Heimdal en macOS. Poner el ticket ahí se llama <strong>inyección</strong>. A partir de ahí, el cliente SMB estándar hace Kerberos normal y corriente: usa el TGT para obtener un ticket de servicio para el servidor de archivos. Ninguna parte de la ruta de acceso a los archivos está modificada.",
  "El \"pase nuevo a mitad de camino\" es una <strong>reinyección</strong>, no una renovación a nivel de Kerberos. Según nuestras pruebas, Windows pide al KDC renovar un TGT inyectado por KerBridge y luego nunca instala el resultado, así que el agente repite el intercambio completo e inyecta un ticket nuevo en su lugar.",
]

not_do_title = "Lo que no hace"
not_do = [
  "No guarda tu contraseña. Nunca llega a verla.",
  "No lee ni cambia tus archivos, tus unidades ni tus letras de unidad.",
  "No sustituye el inicio de sesión de tu organización. Lo usa.",
  "No necesita estar en marcha para que puedas <em>usar</em> tu equipo — solo para mantener tus unidades de red al alcance.",
]

tech_at_rest_hint = "qué se guarda, y dónde"
tech_at_rest = [
  "<strong>Ningún secreto en disco.</strong> El token de acceso se descarta en cuanto termina el intercambio de tickets. El token de actualización se conserva solo en la memoria del proceso y muere con él — nunca se escribe en disco ni en el registro. Lo que sí se guarda en disco es la URL del bróker, una copia en caché de la configuración descubierta y el estado de autorización de este dispositivo. En realidad ni siquiera sabe de tu NAS ni de otros servicios Kerberos; solo trabaja con TGT de Kerberos.",
]

