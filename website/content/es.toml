# ─────────────────────────────────────────────────────────────────────────────
# A partir de aquí se usa la sintaxis de tablas de TOML, y una cabecera de
# tabla captura todas las claves sueltas que la siguen — así que esto tiene que
# ir al final. Añade las claves sencillas nuevas por encima de esta línea, no
# debajo.
# ─────────────────────────────────────────────────────────────────────────────

# Las tres puertas. `access`/`grant`/`signin` alimentan la tabla de Sí/No, y
# este orden es el de la tabla y el de las explicaciones que van debajo.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Cierra la sesión que esta aplicación dejó iniciada en tu navegador. Es buena higiene en un equipo compartido. No toca tus unidades."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Renuncia al permiso de este dispositivo para llegar a tus unidades <em>sin navegador</em>. Tu acceso de ahora mismo queda intacto — simplemente vuelves a iniciar sesión en el navegador cada vez. No se puede deshacer: autorizar de nuevo crea un permiso nuevo en lugar de restaurar el antiguo."
caveat = """
En una máquina de cuenta compartida — una cuyo panel dice que funciona como \
otra cuenta — no existe eso de \"volver al navegador\". La autorización es la \
única manera en que una máquina así obtiene acceso, de modo que quitarla \
significa que el acceso vence y se detiene. La confirmación te dice \
exactamente cuánto tiempo te queda."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Tira el pase de este equipo. Es la puerta de todos los días — lo que haces cuando terminas la jornada o ya no necesitas el acceso a las unidades compartidas."
caveat = """
Una advertencia honesta: <strong>las unidades de red que ya tengas abiertas \
pueden seguir funcionando</strong> hasta que las cierres o reinicies. Es tu \
sistema operativo manteniendo una conexión abierta, y ninguna aplicación \
puede prometer otra cosa. Pero nada nuevo se puede abrir."""

