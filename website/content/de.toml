headline_title = "Die Überschrift"
headline_lead = "Eine farbige Zeile, die die Lage benennt."
headlines = [
  { headline = "cond_working",   tone = "ok",   means = "Ihre Laufwerke funktionieren, und die App hält sie von selbst am Laufen.", todo = "Nichts." },
  { headline = "cond_flaky",     tone = "warn", means = "Ihre Laufwerke funktionieren im Moment. Die App hat Mühe, den Server Ihrer IT zu erreichen.", todo = "Meist nichts — das klärt sich oft von selbst. Hält es an, sagen Sie der IT Bescheid." },
  { headline = "cond_will_stop", tone = "warn", means = "Ihre Laufwerke funktionieren, aber der Zugriff endet zu einem bekannten Zeitpunkt, und nichts erneuert ihn von selbst.", todo = "Nutzen Sie vor diesem Zeitpunkt die Schaltfläche zum Verlängern — wann immer es Ihnen passt." },
  { headline = "cond_stopped",   tone = "stop", means = "Ihre Laufwerke lassen sich nicht öffnen.", todo = "Lesen Sie die Erklärung unter der Überschrift — sie nennt den Grund und bietet die Schaltfläche, die das behebt." },
  { headline = "cond_off",       tone = "off",  means = "Die App ist hier aus, und das soll auch so sein — etwa nachdem Sie sich abgemeldet haben.", todo = "Nichts, außer Sie möchten den Zugriff zurück." },
]
headline_note = "<strong>Eine Ablaufwarnung ist kein Fehler.</strong> Sie bedeutet, dass der App die stillen Wege zum Erneuern ausgegangen sind — oft schlicht, weil die Browsersitzung geschlossen wurde oder die Autorisierung des Geräts zur Erneuerung ansteht. Ihr Zugriff bleibt bis zur angezeigten Zeit bestehen. Ein Klick stellt die stillen Erneuerungen wieder her."

tech_condition_hint = "woraus die Überschrift berechnet wird"
tech_condition = [
  "Die Überschrift stellt <code>Condition</code> dar, eines von <code>Working</code>, <code>Flaky</code>, <code>WillStop</code>, <code>Stopped</code> und <code>NotStarted</code>. Sie ist eine reine Funktion dreier lokaler Tatsachen: ob ein <strong>brauchbares</strong> Ticket vorliegt, ob von dieser Maschine erwartet wird, dass sie hier arbeitet, und ob es eine <strong>stille Quelle</strong> für die nächste Erneuerung gibt.",
  "Netzwerkbefunde fließen nicht ein — ein Broker-Ausfall verändert den Zustand nie. Er erscheint als Hindernis, und als <code>Flaky</code> erst, wenn er länger anhält.",
]

identity_title = "Die Identitätszeile"
identity_signed_in = "Das Konto, zu dem Ihr Zugriff — und alles, was Sie speichern — gehört."
identity_working_as = "Dieser Rechner wurde eingerichtet, um unter einem <em>anderen Konto</em> zu arbeiten."
identity_note = "<strong>Die zweite Zeile sollten Sie zweimal lesen.</strong> Auf so einem Rechner werden Dateien, die Sie auf den Netzlaufwerken speichern, unter dem Namen jenes (oft geteilten) Kontos abgelegt, nicht unter Ihrem. Wenn Sie sich hier anmelden, bürgen Sie für die Maschine — Sie erhalten nicht Ihren eigenen Zugriff. Auf Buildmaschinen, Kiosken und geteilten Arbeitsplätzen ist das normal, und Ihre IT hat es bewusst so eingerichtet."

tech_delegation_hint = "Gerätegenehmigungen"
tech_delegation = [
  "Die Maschine ist <strong>delegiert</strong>, TGTs für ein bestimmtes Konto zu holen: ein <code>grant_for</code>-Ziel ist konfiguriert, sodass nur eine Gerätegenehmigung ein Ticket erhalten kann und die Tickets den Principal des Ziels tragen. Eine delegierte Anmeldung <strong>autorisiert den Zugriff als der angegebene Benutzer</strong>, nicht als die anmeldende Person — die Anmeldung belegt, wer an der Tastatur sitzt, nicht das Konto, mit dem die Maschine Ihre Kerberos-Dienste erreicht.",
]

