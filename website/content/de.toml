doors_title = "Gehen — drei getrennte Türen"
doors_lead = "Diese drei klingen ähnlich, bewirken aber Verschiedenes. Das ist die eine Tabelle dieser Seite, die man sich merken sollte."

tech_doors_hint = "was jede Tür tatsächlich tut"
tech_doors = [
  "<strong>Die Abmeldung beim Identitätsanbieter</strong> beendet die SSO-Sitzung bei der Authority und verwirft das Refresh-Token im Speicher. Sie kann Sie nicht von Windows selbst abmelden; eine Anwendung kann nur ihre eigene Sitzung freigeben.",
  "<strong>Das Entfernen der Autorisierung</strong> löscht <em>zuerst</em> den nicht exportierbaren ECDSA-P-256-Schlüssel der Gerätegenehmigung aus dem TPM dieses Geräts und widerruft ihn erst dann beim Broker — genau diese Reihenfolge lässt es auch offline funktionieren.",
  "<strong>Das Abmelden</strong> ist eine auf den Realm begrenzte Leerung des Ticket-Caches — nur das TGT und die Service-Tickets dieses Realms. Tickets anderer Realms bleiben unberührt, was es in einem Cloud-Trust-Tenant sicher macht. Eine bereits aufgebaute SMB-Sitzung liefert weiter Dateien aus einem leeren Cache, ohne Kerberos-Verkehr — kein auf Tickets begrenztes Kommando kann also ehrlich versprechen, dass Verbindungen enden.",
]

