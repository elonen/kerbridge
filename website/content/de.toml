fixing_mac = "<strong>macOS braucht nichts davon.</strong> Es findet den Realm von selbst; es gibt also keinen Einrichtungsschritt, nirgends im Produkt eine Administratorabfrage und keine Reparatur — eine abgebrochene Verbindung wird dort einfach neu aufgebaut."

