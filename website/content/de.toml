two_worlds_title = "Zwei Systeme, die nicht von selbst zueinanderfinden"
two_worlds = [
  "<strong>Ihr Konto liegt in der Cloud.</strong> Es ist dasselbe Konto, mit dem Sie E-Mails lesen und sich bei Arbeitswebseiten anmelden. Ihre Organisation verwaltet es dort.",
  "<strong>Ihre Dateien liegen in Ihrem Gebäude.</strong> Sie stehen auf einem Dateiserver — dem Gerät, von dem Ihre Netzlaufwerke und freigegebenen Ordner kommen. Dieser Server ist in Sicherheitsfragen bewusst altmodisch und hat von der Cloud noch nie gehört.",
  "Sich selbst überlassen, können sich die beiden nicht darauf einigen, dass Sie Sie sind.",
]

gobetween_title = "NAS Access ist der Vermittler"
gobetween_lead = "NAS Access wandelt Ihre Cloud-Anmeldung in einen Ausweis um, den der Dateiserver versteht und akzeptiert."

worth_knowing_title = "Drei Dinge, die man wissen sollte"
worth_knowing = [
  "<strong>Der Ausweis gilt nur eine begrenzte Zeit.</strong> Meist den größten Teil eines Arbeitstages. Das ist normal und beabsichtigt — genau dadurch kann Ihre Organisation den Zugriff bei Bedarf entziehen.",
  "<strong>NAS Access holt etwa auf halber Strecke unbemerkt einen frischen Ausweis</strong>, lange bevor der alte abläuft. An einem gewöhnlichen Tag bekommen Sie davon nichts mit.",
  "<strong>Es kann nicht erneuern, was es nicht hat.</strong> Kann die App nicht selbstständig einen frischen Ausweis holen, sagt sie Ihnen das, <em>bevor</em> der aktuelle abläuft — ein Klick, und Sie machen weiter.",
]

tech_concepts_hint = "die genauen Begriffe, für alle, die sie möchten"
tech_concepts = [
  "Ihr Cloud-Konto ist eine <strong>OIDC</strong>-Identität bei einem <strong>Identitätsanbieter</strong> (in den meisten Installationen Entra ID). Der Nachweis ist ein OIDC-Access-Token, geholt über einen Authorization-Code-Flow mit PKCE im Systembrowser.",
  "Der <strong>Broker</strong> ist der KerBridge-Dienst, den Ihre IT betreibt. Er prüft das Token und bittet das <strong>KDC</strong>, ein echtes <strong>Kerberos-TGT</strong> (Ticket Granting Ticket) für Ihr Konto im lokalen <strong>Realm</strong> auszustellen.",
  "Die „Ausweistasche“ ist der <strong>Ticket-Cache</strong> Ihrer Anmeldesitzung — unter Windows die LSA-Anmeldesitzung, unter macOS der Heimdal-<code>API:</code>-Cache. Das Ablegen des Tickets dort heißt <strong>Injektion</strong>. Danach macht der normale SMB-Client gewöhnliches Kerberos: er holt mit dem TGT ein Service-Ticket für den Dateiserver. Am Dateizugriffspfad ist nichts verändert.",
  "Der „frische Ausweis auf halber Strecke“ ist eine <strong>Neuinjektion</strong> und keine Erneuerung auf Kerberos-Ebene. Unseren Tests zufolge bittet Windows das KDC zwar, ein von KerBridge injiziertes TGT zu erneuern, installiert das Ergebnis dann aber nie — also führt der Agent den ganzen Austausch erneut durch und injiziert ein neues Ticket.",
]

not_do_title = "Was sie nicht tut"
not_do = [
  "Sie speichert Ihr Passwort nicht. Sie sieht nie eines.",
  "Sie liest und ändert weder Ihre Dateien noch Ihre Laufwerke oder Laufwerksbuchstaben.",
  "Sie ersetzt die Anmeldung Ihrer Organisation nicht. Sie nutzt sie.",
  "Sie muss nicht laufen, damit Sie Ihren Rechner <em>benutzen</em> können — nur damit Ihre Netzlaufwerke erreichbar bleiben.",
]

tech_at_rest_hint = "was gespeichert wird, und wo"
tech_at_rest = [
  "<strong>Kein Geheimnis auf der Festplatte.</strong> Das Access-Token wird verworfen, sobald der Ticket-Austausch abgeschlossen ist. Das Refresh-Token liegt nur im Arbeitsspeicher des Prozesses und stirbt mit ihm — es wird nie auf die Platte und nie ins Protokoll geschrieben. Gespeichert werden die Broker-URL, eine zwischengespeicherte Kopie der ermittelten Konfiguration und der Autorisierungszustand dieses Geräts. Von Ihrem NAS oder anderen Kerberos-Diensten weiß sie eigentlich gar nichts; sie hat nur mit Kerberos-TGTs zu tun.",
]

