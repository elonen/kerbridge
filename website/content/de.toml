[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Schließt die Anmeldesitzung, die diese App in Ihrem Browser hinterlassen hat. Auf einem geteilten Rechner ist das gute Hygiene. Ihre Laufwerke berührt es nicht."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Gibt die Erlaubnis dieses Geräts auf, Ihre Laufwerke <em>ohne Browser</em> zu erreichen. Ihr aktueller Zugriff bleibt unberührt — Sie melden sich künftig einfach jedes Mal über den Browser an. Rückgängig machen lässt sich das nicht: Eine erneute Autorisierung erzeugt eine neue Erlaubnis, statt die alte wiederherzustellen."
caveat = """
Auf einer Maschine mit geteiltem Konto — einer, deren Ansicht sagt, sie arbeite \
unter einem anderen Konto — gibt es kein „zurück zum Browser“. Die Autorisierung \
ist der einzige Weg, auf dem so eine Maschine Zugriff bekommt; sie zu entfernen \
heißt, dass der Zugriff abläuft und endet. Die Bestätigung sagt genau, \
wie viel Zeit Ihnen bleibt."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Wirft den Ausweis dieses Rechners weg. Das ist die alltägliche der drei — das, was man tut, wenn der Tag zu Ende ist oder man den Zugriff auf die geteilten Laufwerke nicht mehr braucht."
caveat = """
Ein ehrlicher Vorbehalt: <strong>Bereits geöffnete Netzlaufwerke funktionieren \
möglicherweise weiter</strong>, bis Sie sie schließen oder neu starten. Dahinter \
steckt Ihr Betriebssystem, das eine Verbindung offen hält — keine App kann etwas \
anderes versprechen. Neu öffnen lässt sich aber nichts."""

