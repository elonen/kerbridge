tech_blockers_hint = "Hindernisse gegenüber Aktionen"
tech_blockers = [
  "Das sind <strong>Hindernisse</strong>: was gerade fehlt, unmittelbar und nicht abgeleitet. Sie sind eine Liste und keine Rangfolge, denn mehrere können gleichzeitig zutreffen, und das Modell meldet alle statt nur das lauteste.",
  "Hindernisse <em>erklären</em>; Aktionen <em>lösen</em>. Sie sind keine parallelen Listen, und nichts entspricht einander. Das Hindernis „Server nicht erreichbar“ fasst Unerreichbarkeit, TLS-Ablehnung, Ratenbegrenzung und 5xx zusammen, weil sich die vier in der Ursache unterscheiden, nicht aber darin, was man dagegen tut; der genaue Satz steht weiterhin in der ausführlichen Meldung.",
]

details_lead = "Ein eingeklappter Abschnitt für den Fall, dass Ihnen jemand hilft. Er enthält den Realm, das Ende des Ausweises, was die nächste Erneuerung verwenden wird, und wann die App es das nächste Mal versucht."
details_supply_lead = "Die nützlichste Zeile benennt, was die nächste Erneuerung verwenden wird:"
supply_grant = "Still. Diesem Gerät wird für eine festgelegte Anzahl von Tagen vertraut."
supply_wam = "Still. Die Windows-eigene Anmeldung erledigt die Arbeit."
supply_browser = "Still, solange die App weiterläuft."
supply_none = "Deshalb warnt die Überschrift, dass der Zugriff abläuft."

conventions_title = "Zwei Konventionen, die sich zu lernen lohnen"
convention_ellipsis = "<strong>Endet eine Beschriftung auf „…“, kommt noch ein Schritt</strong> — ein Browserfenster oder eine Frage, die Sie beantworten müssen. Ohne die Punkte tut die Schaltfläche einfach, was dort steht. Das ist der einzige Unterschied zwischen den beiden Erneuerungsschaltflächen: Beide versprechen dasselbe Ergebnis, aber eine von ihnen öffnet einen Browser."
convention_shield = "<strong>Ein Schild auf einer Schaltfläche heißt, dass Windows nach Administratorrechten fragt.</strong> Es ist dort immer zu sehen, ganz gleich, ob Sie selbst Administrator sind."

