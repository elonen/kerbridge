tech_grant_hint = "die Gerätegenehmigung"
tech_grant = [
  "Das ist eine KerBridge-<strong>Gerätegenehmigung</strong> — ein nicht exportierbarer ECDSA-P-256-Schlüssel im TPM, erzeugt über den Platform Crypto Provider von CNG im Benutzerkontext, sodass er keine Rechteerhöhung braucht und mit dem Profil verschwindet. Der Broker hält den passenden öffentlichen Schlüssel und setzt seine eigene Tagesobergrenze durch — wird diese gesenkt, verkürzt das jede ausstehende Genehmigung.",
]

