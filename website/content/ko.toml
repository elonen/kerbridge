tech_at_rest = [
  "<strong>디스크에 비밀은 남지 않습니다.</strong> 액세스 토큰은 티켓 교환이 끝나는 즉시 폐기됩니다. 리프레시 토큰은 프로세스 메모리에만 있다가 프로세스와 함께 사라집니다 — 디스크에도 로그에도 기록되지 않습니다. 디스크에 저장되는 것은 브로커 URL, 검색된 설정의 캐시 사본, 그리고 이 장치의 승인 상태뿐입니다. 사실 이 앱은 NAS나 다른 Kerberos 서비스의 존재조차 모릅니다. 다루는 것은 Kerberos TGT뿐입니다.",
