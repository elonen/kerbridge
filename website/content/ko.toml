# 여기부터는 TOML 테이블 문법을 사용하며, 테이블 헤더는 그 뒤에 오는 모든 일반
# 키를 삼켜 버립니다 — 그래서 이 부분이 맨 마지막이어야 합니다. 새 일반 키는
# 이 줄 위에 추가하세요.
# ─────────────────────────────────────────────────────────────────────────────

# 세 개의 문. `access`/`grant`/`signin`이 예/아니요 표를 결정하며, 여기의
# 순서가 표와 그 아래 설명의 순서입니다.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "이 앱이 브라우저에 남겨 둔 로그인 세션을 닫습니다. 공용 컴퓨터에서는 좋은 습관입니다. 드라이브에는 손대지 않습니다."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "이 장치가 <em>브라우저 없이</em> 드라이브에 접근할 수 있는 권한을 내려놓습니다. 지금의 액세스는 그대로입니다 — 그저 매번 브라우저로 로그인하는 방식으로 돌아갈 뿐입니다. 되돌릴 수는 없습니다: 다시 승인하면 예전 것이 복원되는 게 아니라 새 권한이 만들어집니다."
caveat = """
공용 계정 컴퓨터 — 패널에 다른 계정으로 동작 중이라고 표시되는 컴퓨터 — 에는 \
\"브라우저로 돌아가기\"라는 선택지가 없습니다. 그런 컴퓨터가 액세스를 얻는 \
길은 승인뿐이라, 승인을 제거하면 액세스는 만료와 함께 끝납니다. 확인 창이 \
남은 시간을 정확히 알려 줍니다."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "이 컴퓨터의 출입증을 버립니다. 셋 중 가장 일상적인 문입니다 — 하루 일을 마쳤거나 공유 드라이브 액세스가 더는 필요 없을 때 쓰는 것입니다."
caveat = """
솔직한 주의 사항 하나: <strong>이미 열어 둔 네트워크 드라이브는 닫거나 다시 \
시작하기 전까지 계속 작동할 수 있습니다</strong>. 운영 체제가 이미 맺어 둔 \
연결을 붙잡고 있는 것이라, 어떤 앱도 다르다고 약속할 수 없습니다. 다만 새로 \
여는 것은 불가능합니다."""

