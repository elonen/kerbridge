worth_knowing_title = "알아 두면 좋은 세 가지"
worth_knowing = [
  "<strong>출입증에는 유효 기간이 있습니다.</strong> 보통 근무일 대부분을 버틸 정도입니다. 이는 정상이고 의도된 것입니다 — 필요할 때 조직이 액세스를 거둬들일 수 있는 것도 바로 이 덕분입니다.",
  "<strong>NAS Access는 유효 기간의 절반쯤에 조용히 새 출입증을 받아 옵니다.</strong> 기존 출입증이 만료되기 한참 전입니다. 평범한 날에는 이 과정이 눈에 띌 일이 없습니다.",
  "<strong>가진 것이 없으면 갱신도 할 수 없습니다.</strong> 앱이 스스로 새 출입증을 받아 올 수 없게 되면, 지금 출입증이 만료되기 <em>전에</em> 미리 알려 드립니다. 클릭 한 번이면 계속 쓸 수 있습니다.",
]

tech_concepts_hint = "정확한 용어가 필요한 분을 위해"
tech_concepts = [
  "클라우드 계정은 <strong>ID 공급자</strong>(대부분의 배포에서는 Entra ID)에 있는 <strong>OIDC</strong> ID입니다. 증명은 OIDC 액세스 토큰이며, 시스템 브라우저에서 PKCE를 사용하는 authorization code 흐름으로 얻습니다.",
  "<strong>브로커</strong>는 IT 팀이 운영하는 KerBridge 서비스입니다. 토큰을 검증한 뒤 <strong>KDC</strong>에 요청해, 온프레미스 <strong>영역</strong>(realm)에서 해당 계정용 정품 <strong>Kerberos TGT</strong>(ticket-granting ticket)를 발급받습니다.",
  "\"출입증 주머니\"는 로그인 세션의 <strong>티켓 캐시</strong>입니다 — Windows에서는 LSA 로그온 세션, macOS에서는 Heimdal의 <code>API:</code> 캐시입니다. 티켓을 그곳에 넣는 일을 <strong>주입</strong>(injection)이라고 부릅니다. 그다음부터는 순정 SMB 클라이언트가 평범한 Kerberos를 수행합니다. TGT로 파일 서버용 서비스 티켓을 받는 것입니다. 파일 액세스 경로는 어느 부분도 수정되지 않습니다.",
  "\"절반쯤에 받는 새 출입증\"은 <strong>재주입</strong>이지, Kerberos 수준의 갱신이 아닙니다. 저희 테스트에 따르면 Windows는 KerBridge가 주입한 TGT의 갱신을 KDC에 요청하고서도 그 결과를 끝내 설치하지 않습니다. 그래서 에이전트는 전체 교환을 처음부터 다시 수행해 새 티켓을 주입합니다.",
]

