tech_concepts_hint = "精确的术语，供需要的人参考"
tech_concepts = [
  "你的云账户是<strong>身份提供方</strong>（多数部署中是 Entra ID）上的一个 <strong>OIDC</strong> 身份。证明是一枚 OIDC 访问令牌，通过系统浏览器里带 PKCE 的授权码流程获得。",
  "<strong>代理服务器</strong>（broker）是你的 IT 团队运行的 KerBridge 服务。它验证令牌，并请 <strong>KDC</strong> 为你的账户在本地<strong>领域</strong>（realm）中签发一张真正的 <strong>Kerberos TGT</strong>（票据授予票据）。",
  "“通行证口袋”就是你登录会话的<strong>票据缓存</strong> — Windows 上是 LSA 登录会话，macOS 上是 Heimdal 的 <code>API:</code> 缓存。把票据放进去的动作叫<strong>注入</strong>。之后，系统自带的 SMB 客户端做的就是普通的 Kerberos：用 TGT 向文件服务器换取服务票据。文件访问路径没有任何部分被改动。",
  "“到一半时的新通行证”是<strong>重新注入</strong>，不是 Kerberos 层面的续期。据我们的测试，Windows 会请 KDC 续期 KerBridge 注入的 TGT，然后从不安装结果，所以应用改为把整个交换重新做一遍，注入一张新票据。",
]

