# ─────────────────────────────────────────────────────────────────────────────
# 从这里往下使用 TOML 的表语法，表头会捕获其后所有裸键 — 所以这些必须放在
# 最后。新的普通键请加在这条线上方，不要加在下方。
# ─────────────────────────────────────────────────────────────────────────────

# 三扇门。`access`/`grant`/`signin` 驱动“是/否”表格，这里的顺序也是表格
# 及其下方解释的顺序。
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "关闭这个应用留在你浏览器里的登录会话。在共享电脑上这是良好的习惯。它不碰你的驱动器。"

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "放弃此设备<em>不经浏览器</em>访问你驱动器的许可。你此刻的访问不受影响 — 只是回到每次都通过浏览器登录的方式。它无法撤销：再次授权创建的是一份新的许可，不会恢复旧的那份。"
caveat = """
在共享账户机器上 — 也就是面板上写着以另一账户身份运行的那种 — 不存在\
“回到浏览器”这条路。授权是这种机器获得访问的唯一途径，移除它就意味着访问\
会用完并停止。确认窗口会准确告诉你还剩多少时间。"""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "扔掉这台电脑的通行证。这是最日常的一扇门 — 一天的活儿干完了，或者不再需要访问共享驱动器时，就用它。"
caveat = """
一句实话实说的提醒：<strong>已经打开的网络驱动器可能会继续可用</strong>，\
直到你关闭它们或重启。那是你的操作系统把一条连接保持着，没有哪个应用能\
承诺不这样。但新的东西打不开了。"""

