tech_at_rest_hint = "保存了什么，存在哪里"
tech_at_rest = [
  "<strong>磁盘上不留任何机密。</strong>票据交换一完成，访问令牌就被丢弃。刷新令牌只保存在进程内存中，随进程一起消失 — 从不写入磁盘或日志。写到磁盘上的只有代理服务器 URL、一份已发现配置的缓存副本，以及此设备的授权状态。它甚至并不真正了解你的 NAS 或其他 Kerberos 服务；它只跟 Kerberos TGT 打交道。",
]

