two_worlds_title = "Dois sistemas que não se encontram por conta própria"
two_worlds = [
  "<strong>Sua conta vive na nuvem.</strong> É a mesma conta que você usa para o e-mail e para entrar nos sites do trabalho. Sua organização a administra lá.",
  "<strong>Seus arquivos vivem no seu prédio.</strong> Eles ficam em um servidor de arquivos — a máquina de onde vêm suas unidades de rede e pastas compartilhadas. Esse servidor é antiquado em matéria de segurança, de propósito, e nunca ouviu falar da nuvem.",
  "Deixados sozinhos, os dois não conseguem concordar que você é você.",
]

gobetween_title = "O NAS Access é o intermediário"
gobetween_lead = "O NAS Access converte seu login na nuvem em um passe que o servidor de arquivos entende e aceita."

worth_knowing_title = "Três coisas que vale a pena saber"
worth_knowing = [
  "<strong>O passe tem prazo de validade.</strong> Normalmente, a maior parte de um dia de trabalho. Isso é normal e proposital — é o que permite à sua organização retirar o acesso quando precisa.",
  "<strong>O NAS Access obtém discretamente um passe novo mais ou menos na metade do caminho</strong>, muito antes de o antigo vencer. Em um dia comum, você nunca vai ver isso acontecer.",
  "<strong>Ele não pode renovar o que não tem.</strong> Se o aplicativo não conseguir um passe novo por conta própria, ele avisa <em>antes</em> de o atual vencer, para que você clique uma vez e siga em frente.",
]

tech_concepts_hint = "os termos precisos, para quem os quiser"
tech_concepts = [
  "Sua conta na nuvem é uma identidade <strong>OIDC</strong> em um <strong>provedor de identidade</strong> (Entra ID na maioria das implantações). A prova é um token de acesso OIDC, obtido por um fluxo authorization code com PKCE no navegador do sistema.",
  "O <strong>broker</strong> é o serviço KerBridge que sua equipe de TI mantém. Ele valida o token e pede ao <strong>KDC</strong> que emita um <strong>Kerberos TGT</strong> genuíno (ticket-granting ticket) para a sua conta no <strong>reino</strong> local.",
  "O \"bolso de passes\" é o <strong>cache de tickets</strong> da sua sessão de login — a sessão de logon do LSA no Windows, o cache <code>API:</code> do Heimdal no macOS. Colocar o ticket ali chama-se <strong>injeção</strong>. Depois disso, o cliente SMB comum faz Kerberos comum: usa o TGT para obter um ticket de serviço para o servidor de arquivos. Nenhuma parte do caminho de acesso aos arquivos é modificada.",
  "O \"passe novo na metade do caminho\" é uma <strong>reinjeção</strong>, não uma renovação no nível do Kerberos. Segundo nossos testes, o Windows pede ao KDC que renove um TGT injetado pelo KerBridge e depois nunca instala o resultado, então o agente executa a troca inteira de novo e injeta um ticket novo no lugar.",
]

not_do_title = "O que ele não faz"
not_do = [
  "Ele não armazena sua senha. Ele nunca a vê.",
  "Ele não lê nem altera seus arquivos, suas unidades ou suas letras de unidade.",
  "Ele não substitui o login da sua organização. Ele o usa.",
  "Ele não precisa estar em execução para você <em>usar</em> o computador — só para manter suas unidades de rede acessíveis.",
]

tech_at_rest_hint = "o que fica guardado, e onde"
tech_at_rest = [
  "<strong>Nenhum segredo em disco.</strong> O token de acesso é descartado no momento em que a troca de tickets termina. O refresh token fica apenas na memória do processo e morre com ele — nunca é gravado em disco nem no registro. O que fica em disco são a URL do broker, uma cópia em cache da configuração descoberta e o estado de autorização deste dispositivo. Ele nem sequer sabe de fato do seu NAS ou de outros serviços Kerberos; ele lida apenas com TGTs Kerberos.",
]

