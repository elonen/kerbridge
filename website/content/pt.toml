tech_condition_hint = "de onde o título é calculado"
tech_condition = [
  "O título exibe <code>Condition</code>, um entre <code>Working</code>, <code>Flaky</code>, <code>WillStop</code>, <code>Stopped</code> e <code>NotStarted</code>. É uma função pura de três fatos locais: se há um ticket <strong>utilizável</strong> em mãos, se esta máquina deveria estar funcionando aqui, e se existe uma <strong>fonte silenciosa</strong> para a próxima renovação.",
  "Nenhum fato de rede entra no cálculo — uma queda do broker nunca move a condição. Ela aparece como um bloqueio, e como <code>Flaky</code> apenas depois de persistir.",
]

