identity_note = "<strong>A segunda vale ler duas vezes.</strong> Em um computador assim, os arquivos que você salva nas unidades de rede ficam em nome dessa conta (muitas vezes compartilhada), não no seu. Se você entra ali, está respondendo pela máquina — não está obtendo o seu próprio acesso. Isso é normal em máquinas de build, quiosques e estações de trabalho compartilhadas, e sua equipe de TI configurou assim de propósito."

tech_delegation_hint = "concessões de dispositivo"
tech_delegation = [
  "A máquina é <strong>delegada</strong> a obter TGTs para uma conta específica: um destino <code>grant_for</code> está configurado, então só uma concessão de dispositivo consegue obter um ticket, e os tickets carregam o principal do destino. Um login delegado <strong>autoriza o acesso como o usuário especificado</strong>, não como a pessoa que entra — o login prova quem está no teclado, não a conta com que a máquina alcança seus serviços Kerberos.",
]

