# ─────────────────────────────────────────────────────────────────────────────
# Daqui para baixo usa-se a sintaxe de tabelas do TOML, e um cabeçalho de
# tabela captura toda chave solta que vier depois — então isto tem de ficar
# por último. Acrescente chaves simples novas acima desta linha, não abaixo.
# ─────────────────────────────────────────────────────────────────────────────

# As três portas. `access`/`grant`/`signin` alimentam a tabela de Sim/Não, e a
# ordem aqui é a ordem da tabela e das explicações abaixo dela.
[[doors]]
action = "act_sign_out_idp"
arg = "Entra"
access = false
grant  = false
signin = true
detail = "Fecha a sessão de login que este aplicativo deixou no seu navegador. É boa higiene em um computador compartilhado. Não toca nas suas unidades."

[[doors]]
action = "act_give_up_grant"
access = false
grant  = true
signin = false
detail = "Abre mão da permissão deste dispositivo de alcançar suas unidades <em>sem navegador</em>. Seu acesso de agora fica intacto — você só volta a entrar pelo navegador a cada vez. Não pode ser desfeito: autorizar de novo cria uma permissão nova em vez de restaurar a antiga."
caveat = """
Em uma máquina de conta compartilhada — uma cuja tela diz que ela funciona \
como outra conta — não existe \"voltar ao navegador\". A autorização é a única \
maneira de uma máquina dessas obter acesso, então removê-la significa que o \
acesso vence e para. A confirmação diz exatamente quanto tempo você tem."""

[[doors]]
action = "act_drop_ticket"
access = true
grant  = false
signin = false
detail = "Joga fora o passe deste computador. É a porta do dia a dia — o que fazer quando você terminou por hoje, ou quando não precisa mais do acesso às unidades compartilhadas."
caveat = """
Uma ressalva honesta: <strong>as unidades de rede que você já tem abertas \
podem continuar funcionando</strong> até que você as feche ou reinicie. É o \
seu sistema operacional segurando uma conexão aberta, e nenhum aplicativo \
pode prometer o contrário. Mas nada de novo pode ser aberto."""

