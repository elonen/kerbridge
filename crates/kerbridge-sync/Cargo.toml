[package]
name = "kerbridge-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kerbridge-core = { workspace = true, features = ["tls", "password"] }
# The seam and the subject encoding, so what sync writes is what the broker's
# verifier emits. `sync` is the IdP directory face; this is the one crate that turns
# it on.
kerbridge-idp = { workspace = true, features = ["sync"] }
kerbridge-notify.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

tokio.workspace = true
ldap3.workspace = true

rustls.workspace = true

# sync is the only writer of `sAMAccountName`, so it is the only component that
# needs Unicode normalization
unicode-normalization.workspace = true
