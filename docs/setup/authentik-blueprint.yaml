# KerBridge — everything authentik must hold, as one blueprint.
#
# Paste into Customization -> Blueprints -> Create, source "Internal", Enabled
# on, Context empty. Then click Apply on the new row: creating an instance does
# not apply it, and left alone it waits for the hourly scheduler.
#
# Nothing here needs editing, unless your instance has more than one signing
# certificate: then name yours on the `signing_key` line.
#
# Afterwards, two values are yours to fetch:
#   1. the pk of the group "KerBridge Allowed On-prem Users" -> admission_group_id
#   2. an API token on svc-kerbridge-sync, intent "API"      -> sync_credential_file
#      Its Identifier is a slug: kerbridge-sync-api-token.
version: 1
metadata:
  name: KerBridge

entries:
  # state: present -- these fields are re-applied on every run, so the four
  # settings that fail silently cannot drift. Anything not listed here is left
  # alone.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    id: kerbridge-provider
    identifiers:
      name: KerBridge
    attrs:
      client_type: public
      client_id: kerbridge
      # The agent binds an ephemeral loopback port, so the whole range must be
      # admitted: authentik does not implement RFC 8252 section 7.3. Single
      # quotes -- a backslash in plain YAML is literal, and double quotes would
      # store `127.0.0.1` as a regex matching any character in place of the dots.
      redirect_uris:
        - matching_mode: regex
          url: 'http://127\.0\.0\.1:[0-9]{1,5}'
      # A blueprint-created provider gets `grant_types: []` and refuses
      # authorization_code with a bare `invalid_request`. The admin UI fills
      # this list in for you; a blueprint does not.
      grant_types:
        - authorization_code
        - refresh_token
      # The default `hashed_user_id` cannot be looked up through the REST API,
      # so sync could never match a signed-in user to a directory entry.
      sub_mode: user_uuid
      include_claims_in_id_token: true
      issuer_mode: per_provider
      # WITHOUT this a provider signs HS256 with its client secret and publishes
      # an empty JWKS. That is the default, not a corner case.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      # `offline_access` must be attached here AND requested by the client. Left
      # off, the scope is dropped without a word and the agent can never renew
      # in the background.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]]

  # state: created -- yours to rename, re-icon and bind policies to. Never
  # touched again after the first run.
  - model: authentik_core.application
    state: created
    identifiers:
      slug: kerbridge
    attrs:
      name: KerBridge
      provider: !KeyOf kerbridge-provider

  - model: authentik_core.group
    state: created
    identifiers:
      name: KerBridge Allowed On-prem Users

  - model: authentik_core.user
    state: created
    id: kerbridge-sync-account
    identifiers:
      username: svc-kerbridge-sync
    attrs:
      name: KerBridge sync
      type: service_account
      is_active: true
      path: goauthentik.io/service-accounts

  # state: present -- the grant is re-applied, because a partial one reads as a
  # working one: an object-scoped grant returns 200 with a silently shortened
  # list, and sync would treat everyone missing from it as having left.
  - model: authentik_rbac.role
    state: present
    id: kerbridge-sync-role
    identifiers:
      name: KerBridge sync (read-only)
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.view_group

  - model: authentik_core.group
    state: present
    identifiers:
      name: KerBridge sync
    attrs:
      roles:
        - !KeyOf kerbridge-sync-role
      users:
        - !KeyOf kerbridge-sync-account
