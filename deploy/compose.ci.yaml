# The stack as an automated test runs it: same images, same entrypoints, same
# bootstrap scripts, but isolated from any bench that happens to be running on
# the same machine.
#
# Layered after the bench overlays and before the tier's own --
# `COMPOSE_FILE=compose.yaml:compose.nas.yaml:compose.mockidp.yaml:compose.ci.yaml:compose.ci-entra.yaml`,
# which is what scripts/bench/ci-stack.sh sets. Never part of a deployment.
#
# This overlay contains only isolation settings, so every stack tier can use it.
# All four settings are necessary. Without them, `make test-stack` can modify the
# development bench:
#
#   1. COMPOSE_PROJECT_NAME=kerbridge-ci (set by scripts/bench/provision.sh)
#      gives it its own volumes and its own network. The durable state of a
#      bench is untouched.
#   2. `container_name` is fixed in compose.yaml, and a fixed name is global --
#      two projects cannot both have kerbridge-realm. Renamed here, after
#      CI_PROJECT, so that two *tiers* cannot collide either.
#   3. The subnet is fixed in .env, and Docker refuses a second network
#      overlapping the first. provision.sh writes a different one.
#   4. Published ports are the one thing no namespace separates. Dropped here,
#      except the single one the test itself talks to.
#
# Source-specific settings belong in the stack tier's overlay. For Entra,
# compose.ci-entra.yaml provides the stand-in authority and the key document.
# Keeping them separate prevents another tier from inheriting an invalid service
# and a bind mount for a file that it does not generate.

services:
  realm:
    container_name: ${CI_PROJECT:-kerbridge-ci}-realm
    # Nothing outside the compose network talks to the KDC, LDAP or SMB in a CI
    # run: the only SMB client is nas1, which is on it. `!reset` rather than an
    # empty override because compose *appends* to a port list, so an override
    # cannot otherwise remove one.
    ports: !reset []

  issuer:
    container_name: ${CI_PROJECT:-kerbridge-ci}-issuer

  broker:
    container_name: ${CI_PROJECT:-kerbridge-ci}-broker
    # `!override` and not `!reset` here: `!reset` discards the node whatever is
    # written under it, so a replacement list under it publishes nothing.
    # `!override` is the one that substitutes -- compose.nas.yaml uses it on this
    # same key for the same reason.
    ports: !override
      # Caddy shares this service's network namespace, so this is caddy's :443.
      # The one published port, because the test's own client is the host's curl
      # -- and on a host port that no deployment uses, so a bench holding :443
      # does not collide with it.
      - "127.0.0.1:${CI_HTTPS_PORT:-8443}:443"
    networks:
      kerbridge:
        # curl and the client in nas1 validate the broker name on the certificate.
        # BROKER_FQDN must differ from the DC alias in compose.yaml. If both
        # containers use one name, DNS returns two addresses and clients can reach
        # the DC instead of the broker.
        aliases: ["${BROKER_FQDN}"]

  caddy:
    container_name: ${CI_PROJECT:-kerbridge-ci}-caddy

  sync:
    container_name: ${CI_PROJECT:-kerbridge-ci}-sync

  nas1:
    container_name: ${CI_PROJECT:-kerbridge-ci}-nas1
    ports: !reset []
    # All tiers mount the client, the sign-in helper, and the CA read-only. The
    # tier's .env fragment selects the sign-in helper.
    #
    # Use bind mounts instead of `docker compose cp`. nas1 drops all capabilities,
    # so root cannot read a copied file owned by the host user. These files are
    # world-readable; the client creates its ccache inside the container as 0600.
    volumes:
      - ${CI_CLIENT_BIN}:/usr/local/bin/kerbridge:ro
      - ${CI_APPROVE_SH}:/usr/local/bin/kb-approve:ro
      - ${CI_CA_CRT}:/etc/kerbridge-ci-ca.crt:ro
