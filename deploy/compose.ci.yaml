# The stack as an automated test runs it: same images, same entrypoints, same
# bootstrap scripts, but isolated from any bench that happens to be running on
# the same machine and cut loose from Entra.
#
# Layered last --
# `COMPOSE_FILE=compose.yaml:compose.nas.yaml:compose.mockidp.yaml:compose.ci.yaml`,
# which is what scripts/bench/ci-stack.sh sets. Never part of a deployment.
#
# Four things separate a CI run from a bench, and all four have to hold at once
# or `make test-stack` eats the developer's realm:
#
#   1. COMPOSE_PROJECT_NAME=kerbridge-ci (set by ci-stack.sh) gives it its own
#      volumes and its own network. The durable state of a bench is untouched.
#   2. `container_name` is fixed in compose.yaml, and a fixed name is global --
#      two projects cannot both have kerbridge-realm. Renamed here.
#   3. The subnet is fixed in .env, and Docker refuses a second network
#      overlapping the first. ci-stack.sh writes a different one.
#   4. Published ports are the one thing no namespace separates. Dropped here,
#      except the single one the test itself talks to.
#
# The mock authority is reach rather than isolation: a CI run has no tenant, so
# something on this network has to answer `/authorize` before the client's own
# sign-in can be tested at all. compose.mockidp.yaml is written for a bench and
# this file narrows it -- no published port, the corpus signing key instead of a
# fresh one, and a name of its own on the network.
#
# What it cuts loose: configs/idp_entra.toml's provider_config.jwks_file points
# the broker at a locally generated key document instead of the tenant's, which
# is the configuration idp_entra.toml.example's jwks_file comment describes as
# supported-but-not-default. The token is generated by
# testbench/fixtures/entra-token/make_fixtures.py at the top of the run, so it
# is inside its own validity window when POST /ticket sees it. That is the
# whole server path -- verify, resolve, issue -- with no tenant and no secret,
# which is what makes it runnable on a fork's pull request.

services:
  realm:
    container_name: kerbridge-ci-realm
    # Nothing outside the compose network talks to the KDC, LDAP or SMB in a CI
    # run: the only SMB client is nas1, which is on it. `!reset` rather than an
    # empty override because compose *appends* to a port list, so an override
    # cannot otherwise remove one.
    ports: !reset []

  issuer:
    container_name: kerbridge-ci-issuer

  broker:
    container_name: kerbridge-ci-broker
    # `!override` and not `!reset` here: `!reset` discards the node whatever is
    # written under it, so a replacement list under it publishes nothing.
    # `!override` is the one that substitutes -- compose.nas.yaml uses it on this
    # same key for the same reason.
    ports: !override
      # Caddy shares this service's network namespace, so this is caddy's :443.
      # The one published port, because the test's own client is the host's curl
      # -- and on a host port that no deployment uses, so a bench holding :443
      # does not collide with it.
      - "127.0.0.1:${CI_HTTPS_PORT:-8443}:443"
    volumes:
      # Generated fresh at the start of every run; never the committed corpus,
      # which is deliberately expired and would fail verification at wall clock.
      # Its own mount point: /etc/kerbridge is the config set and
      # /run/kerbridge the issuer socket, both read-only binds already, and a
      # file cannot be mounted inside one. configs/idp_entra.toml's
      # provider_config.jwks_file is what points the broker here.
      #
      # Not /etc/jwks, which is where compose.mockidp.yaml mounts the volume the
      # mock writes its own key document into. That volume is read-only, and a
      # file mounted *inside* a read-only mount cannot have its mountpoint
      # created -- the container then fails to start with "read-only file
      # system" naming a path that plainly is not in the image. Nothing needs
      # both: this run has the mock sign with the corpus key (see below), so
      # /etc/jwks is mounted and unread.
      - ${CI_FIXTURE_DIR}/jwks.json:/etc/kerbridge-ci-jwks/entra.json:ro
    networks:
      kerbridge:
        # So the certificate the test presents to curl is checked against the
        # name it was issued for, rather than waved through with -k -- and so the
        # client inside nas1 can dial the broker by the name on that certificate.
        #
        # compose.yaml gives the *DC* its own alias, and ci-stack.sh is careful
        # that BROKER_FQDN is not that name: two containers answering to one name
        # is two A records, and which one a client reaches is then a coin flip
        # that presents as a TLS or a Kerberos fault rather than as a duplicate.
        aliases: ["${BROKER_FQDN}"]

  caddy:
    container_name: kerbridge-ci-caddy

  # The stand-in authority, from compose.mockidp.yaml, which ci-stack.sh layers
  # in before this file. It is what makes the client's *own* sign-in testable:
  # authorization-code + PKCE against something that answers, rather than against
  # a tenant this run does not have.
  mockidp:
    container_name: kerbridge-ci-mockidp
    # Nothing outside the network talks to it: the only client is inside nas1.
    # The overlay publishes :8443 for a bench, and that is also the port
    # ci-stack.sh publishes the broker on -- so leaving it would make the two
    # collide on any host running both.
    ports: !reset []
    environment:
      # Sign with the corpus key rather than a fresh one, so the tokens this
      # issues verify against the same jwks.json the broker already mounts above
      # and no second key document has to be wired anywhere. make_fixtures.py
      # leaves it beside the corpus it signed; testbench/mock-idp/README.md
      # documents this as the way to adopt it.
      IDP_SIGNING_KEY: /etc/jwks/signing-key.pem
    volumes:
      - ${CI_FIXTURE_DIR}/signing-key.pem:/etc/jwks/signing-key.pem:ro
    networks:
      kerbridge:
        # Its own name, on the broker's certificate (ci-stack.sh puts both in the
        # SAN). Not the broker's: they are two servers on two containers, and the
        # client has to reach the one it was told about.
        aliases: ["idp.${AD_DNS_DOMAIN}"]

  sync:
    container_name: kerbridge-ci-sync

  # From compose.nas.yaml, which ci-stack.sh layers in before this file:
  # nas1 is the only SMB client in the run, and the SMB leg is
  # the point of the product.
  nas1:
    container_name: kerbridge-ci-nas1
    ports: !reset []
    # What the *real* client needs to run where the ticket has to land. Read-only,
    # and none of it is state.
    #
    # A bind mount rather than `docker compose cp`: nas1 is `cap_drop: ALL`, so
    # the root it runs as cannot read a file it does not own, and cp carries the
    # host uid in. These are 0755 and world-readable, which needs no chown; the
    # ccache the client writes *inside* the container is 0600 and that
    # container's own.
    volumes:
      - ${CI_CLIENT_BIN}:/usr/local/bin/kerbridge:ro
      - ${CI_APPROVE_SH}:/usr/local/bin/kb-approve:ro
      - ${CI_CA_CRT}:/etc/kerbridge-ci-ca.crt:ro
